// ---------------------------------------------------------------- de baan
// Een acht: eerst onder de brug door, de heuvel op en weer af, linksom terug en dan OVER de brug,
// omlaag naar de steile kom (tot 80 graden gekanteld) en terug naar de start.
// x, z, hoogte, kanteling in graden (de richting volgt de bocht vanzelf)
const CP = [
  [0, 0, 0, 0], [1400, 1300, 60, 0], [2300, 2400, 200, 0], [2300, 3000, 280, 0], [2300, 3600, 320, 0],   // recht omhoog naar de schans
  [2300, 4300, 190, 0], [2300, 4900, 110, 0], [2300, 5600, 90, 0], [2250, 6300, 120, 10],            // over het water, lager landen, rechtdoor
  [1400, 7000, 220, 30], [0, 7100, 300, 30], [-1400, 6500, 340, 28], [-2300, 5000, 360, 22], [-2500, 3000, 370, 12], [-1500, 1500, 365, 0],
  [0, 0, 360, 0], [1100, -1100, 330, 6], [2100, -2300, 270, 40], [2050, -3500, 215, 74], [1000, -4250, 205, 80],
  [-350, -4150, 205, 80], [-1350, -3300, 195, 66], [-1550, -2000, 100, 22], [-1000, -900, 20, 0]
];

const TR = {};
function buildTrack() {
  const n = CP.length, SUB = 96, dense = [];
  const cr = (a, b, c, d, t) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
  for (let i = 0; i < n; i++) {
    const a = CP[(i - 1 + n) % n], b = CP[i], c = CP[(i + 1) % n], d = CP[(i + 2) % n];
    for (let k = 0; k < SUB; k++) {
      const t = k / SUB, q = [0, 1, 2, 3].map(j => cr(a[j], b[j], c[j], d[j], t));
      dense.push([q[0], q[2], q[1], q[3]]);   // x, y(hoogte), z, kanteling
    }
  }
  dense.push(dense[0]);
  const cum = [0];
  for (let i = 1; i < dense.length; i++) cum.push(cum[i - 1] + Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1], dense[i][2] - dense[i - 1][2]));
  const len = cum[cum.length - 1], N = Math.round(len / STEP), step = len / N;
  const P = new Float32Array(N * 3), bankMag = new Float32Array(N);
  let k = 0;
  for (let i = 0; i < N; i++) {
    const s = i * step;
    while (cum[k + 1] < s) k++;
    const t = (s - cum[k]) / (cum[k + 1] - cum[k] || 1), A = dense[k], B = dense[k + 1];
    for (let j = 0; j < 3; j++) P[i * 3 + j] = A[j] + (B[j] - A[j]) * t;
    bankMag[i] = A[3] + (B[3] - A[3]) * t;
  }
  const v = i => { i = (i + N) % N; return [P[i * 3], P[i * 3 + 1], P[i * 3 + 2]]; };
  const T = [], R0 = [];
  for (let i = 0; i < N; i++) {
    const t = norm(sub(v(i + 1), v(i - 1)));
    T.push(t); R0.push(norm([-t[2], 0, t[0]]));
  }
  // richting van de bocht (rechts = +), uitgesmeerd zodat de kanteling niet verspringt
  const curv = T.map((t, i) => dot(sub(T[(i + 1) % N], T[(i - 1 + N) % N]), R0[i]));
  const sgn = new Float32Array(N);
  for (let i = 0; i < N; i++) { let a = 0; for (let j = -30; j <= 30; j++) a += curv[(i + j + N) % N]; sgn[i] = Math.tanh(a / 61 * 160); }
  const R = [], U = [];
  for (let i = 0; i < N; i++) {
    const b = bankMag[i] * sgn[i] * Math.PI / 180, u0 = cross(R0[i], T[i]);
    const r = norm(add(scale(R0[i], Math.cos(b)), scale(u0, -Math.sin(b))));
    R.push(r); U.push(cross(r, T[i]));
  }
  // kromming in het wegvlak (kg, stuurt je mee) en loodrecht erop (kn, drukt je op de weg)
  const kg0 = [], kn0 = [];
  for (let i = 0; i < N; i++) {
    const dT = scale(sub(T[(i + 1) % N], T[(i - 1 + N) % N]), 1 / (2 * step));
    kg0.push(dot(dT, R[i])); kn0.push(dot(dT, U[i]));
  }
  const smooth = (a, w) => a.map((_, i) => { let s = 0; for (let j = -w; j <= w; j++) s += a[(i + j + N) % N]; return s / (2 * w + 1); });
  // schans en gat: het lintpunt het dichtst bij JUMP_AT (rand van de schans) en LAND_AT (begin van de landing)
  const near = (x, z) => { let b = 0, bd = 1e18; for (let i = 0; i < N * 0.45; i++) { const d = (P[i * 3] - x) ** 2 + (P[i * 3 + 2] - z) ** 2; if (d < bd) { bd = d; b = i; } } return b; };
  const lipI = near(JUMP_AT[0], JUMP_AT[1]), landI = near(LAND_AT[0], LAND_AT[1]);
  Object.assign(TR, { lipI, landI, lipS: lipI * step, gapL: (landI - lipI) * step, N, len, step, P, T, R, U, kg: smooth(kg0, 4), kn: smooth(kn0, 4), bank: Array.from(bankMag, (m, i) => m * sgn[i]) });
}

// punt op de baan op afstand s (lineair tussen twee lintpunten)
function at(s, o) {
  const { N, step, P, T, R, U, kg, kn } = TR;
  s = ((s % TR.len) + TR.len) % TR.len;
  const f = s / step, i = Math.floor(f) % N, j = (i + 1) % N, t = f - Math.floor(f), w = 1 - t;
  o.px = P[i * 3] * w + P[j * 3] * t; o.py = P[i * 3 + 1] * w + P[j * 3 + 1] * t; o.pz = P[i * 3 + 2] * w + P[j * 3 + 2] * t;
  o.tx = T[i][0] * w + T[j][0] * t; o.ty = T[i][1] * w + T[j][1] * t; o.tz = T[i][2] * w + T[j][2] * t;
  o.rx = R[i][0] * w + R[j][0] * t; o.ry = R[i][1] * w + R[j][1] * t; o.rz = R[i][2] * w + R[j][2] * t;
  o.ux = U[i][0] * w + U[j][0] * t; o.uy = U[i][1] * w + U[j][1] * t; o.uz = U[i][2] * w + U[j][2] * t;
  o.kg = kg[i] * w + kg[j] * t; o.kn = kn[i] * w + kn[j] * t; o.i = i;
  return o;
}
// kleine vectorhulp
function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function scale(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ---------------------------------------------------------------- physics
// Snelheid wordt bewaard in het wegvlak: vT langs de baan, vR naar rechts. psi = koers t.o.v. de baan.
// Zwaartekracht valt uiteen in een deel langs de weg (heuvels), een deel opzij (kanteling: trekt je
// omlaag) en een deel loodrecht op de weg. Houvast opzij is begrensd door de druk op de weg (MU * N):
// op een steile wand houdt alleen snelheid (v^2 * kn) je boven.
const Q = {}, Q2 = {}, Q3 = {};
// schans over het water: rand van de schans en begin van de landing (x, z), lengte en hoogte van de schans
const JUMP_AT = [2300, 3600], LAND_AT = [2300, 4500], RAMP_L = 130, RAMP_H = 30;
// waar sta je ten opzichte van de schansrand? (negatief = ervoor)
function gapPos(s) { let u = ((s - TR.lipS) % TR.len + TR.len) % TR.len; if (u > TR.len / 2) u -= TR.len; return u; }
function driftLevel(t) { return t > 1.6 ? 3 : t > 1.0 ? 2 : t > 0.5 ? 1 : 0; }
function stepEnt(e) {
  const c = e.car, k = e.skill, inp = e.in;
  at(e.s, Q);
  e.steer += (inp.steer - e.steer) * Math.min(1, DT * 9);
  const air = e.air;
  let cs = Math.cos(e.psi), sn = Math.sin(e.psi);
  let vf = e.vT * cs + e.vR * sn;
  let turn = inp.drift ? c.turn * 1.43 : c.turn;
  if (air) turn *= 0.45;
  const rate = turn * e.steer * (0.3 + 0.7 * Math.min(1, Math.abs(vf) / 260)) / (1 + Math.max(0, vf) / 3600);
  e.psi += rate * DT * (vf < -5 ? -1 : 1);
  cs = Math.cos(e.psi); sn = Math.sin(e.psi);
  vf = e.vT * cs + e.vR * sn;
  let vl = -e.vT * sn + e.vR * cs;

  // driften laadt een boost op (zoals in komeet.html)
  if (inp.drift && !air && vf > 380) { if (Math.abs(e.steer) > 0.35) e.driftT += DT; }
  else if (!inp.drift) {
    const lv = driftLevel(e.driftT);
    if (lv) { e.padT = Math.max(e.padT, [0, 0.45, 0.8, 1.15][lv]); vf += [0, 90, 150, 210][lv]; e.ev.drift = lv; }
    e.driftT = 0;
  } else e.driftT = 0;
  if (e.padT > 0) e.padT -= DT;
  const manual = inp.boost && e.energy > 0.01 && !air;
  if (manual) e.energy = Math.max(0, e.energy - c.drain * DT);
  else e.energy = Math.min(1, e.energy + 0.055 * DT);
  e.boosting = manual || e.padT > 0;
  const gas = inp.acc || manual;
  const top = (e.boosting ? c.boostTop : c.top) * k;
  if (gas) vf += (e.boosting ? c.boostAcc : c.acc) * (1 - vf / top) * (air ? 0.3 : 1) * DT;
  else vf -= vf * 0.4 * DT;
  if (!e.boosting && vf > c.top * k) vf -= (vf - c.top * k) * 1.2 * DT;
  if (inp.brk && !air) vf = Math.max(-160, vf - 950 * DT);
  if (inp.drift && !air) vf -= vf * 0.12 * DT;

  // zwaartekracht in het wegvlak, omgerekend naar de richting van het schip
  const gT = -GRAV * Q.ty * 0.85, gR = -GRAV * Q.ry;
  vf += (gT * cs + gR * sn) * DT;
  const gl = -gT * sn + gR * cs;
  const N = GRAV * Q.uy + e.vT * e.vT * Q.kn + ADH;   // druk op de weg (als versnelling)
  e.load = N;
  let grip = inp.drift ? 2.0 : c.grip;
  let F;
  if (air) F = -vl * 0.15;
  else {
    const cap = MU * Math.max(0, N);
    F = clamp(-vl * grip - gl, -cap, cap);
    e.slip = Math.abs(-vl * grip - gl) > cap;
  }
  vl += (gl + F) * DT;

  e.vT = vf * cs - vl * sn; e.vR = vf * sn + vl * cs;
  // de weg draait onder je door: koers en snelheid draaien mee terug
  const ds = e.vT * DT / Math.max(0.3, 1 - e.d * Q.kg);
  const a = Q.kg * ds, ca = Math.cos(a), sa = Math.sin(a);
  e.psi -= a;
  const vT = e.vT * ca + e.vR * sa; e.vR = -e.vT * sa + e.vR * ca; e.vT = vT;
  const g0 = gapPos(e.s);
  e.s += ds; e.progress += ds;
  // schans: omhoog over de schans, bij de rand de lucht in; geen weg in het gat
  const g1 = gapPos(e.s);
  if (!e.air) {
    if (g1 > -RAMP_L && g1 <= 0) e.z = RAMP_H * (g1 + RAMP_L) / RAMP_L;
    else if (g0 <= 0 && g1 > 0 && g1 < TR.gapL) {
      // de sprong rekent met echte hoogte: de weg aan de overkant ligt lager
      e.air = true; e.gapFly = true; e.airT = 0; e.ev.jump = 1; e.z = RAMP_H;

  // loskomen bij een top, landen

    } else { e.vz -= (N - ADH * 0.7) * DT; e.z += e.vz * DT; }   // in de lucht trekt de magneet minder
    e.airT += DT;

  const maxD = HW - SHIP_R;

}

// botsen tussen schepen, in baancoordinaten (dus niet met iemand op de brug boven je)
function collide(ents) {
  for (let i = 0; i < ents.length; i++) for (let j = i + 1; j < ents.length; j++) {
    const a = ents[i], b = ents[j];
    let dsv = b.s - a.s; dsv -= Math.round(dsv / TR.len) * TR.len;
    const dd = b.d - a.d;
    if (Math.abs(dsv) > 70 || Math.abs(dd) > 44 || Math.abs(a.z - b.z) > 40) continue;
    const ox = 70 - Math.abs(dsv), oy = 44 - Math.abs(dd);
    const ma = a.car.mass, mb = b.car.mass, wa = mb / (ma + mb), wb = ma / (ma + mb);
    if (oy < ox * 0.63) {
      const sd = Math.sign(dd || 1);
      a.d -= sd * oy * wa; b.d += sd * oy * wb;
      const rv = b.vR - a.vR;
      if (rv * sd < 0) { a.vR += rv * wa * 1.2; b.vR -= rv * wb * 1.2; }
    } else {
      const sd = Math.sign(dsv || 1);
      a.s -= sd * ox * wa; b.s += sd * ox * wb; a.progress -= sd * ox * wa; b.progress += sd * ox * wb;
      const rv = b.vT - a.vT;
      if (rv * sd < 0) { a.vT += rv * wa * 1.1; b.vT -= rv * wb * 1.1; }
    }
  }
}

function aiInput(e, ents) {
  at(e.s + 240 + Math.max(0, e.vT) * 0.35, Q2);
  let target = clamp(Q2.kg * 70000, -HW * 0.6, HW * 0.6) + e.lane;
  for (const o of ents) {
    if (o === e) continue;
    let dsv = o.s - e.s; dsv -= Math.round(dsv / TR.len) * TR.len;
    if (dsv > 0 && dsv < 220 && Math.abs(o.d - e.d) < 60 && o.vT < e.vT + 40) target = o.d + (o.d > e.d ? -75 : 75);
  }
  target = clamp(target, -HW + 40, HW - 40);
  const want = Math.atan2(target - e.d, 320);
  e.in.steer = clamp((want - e.psi) * 3, -1, 1);
  e.in.acc = true; e.in.brk = false; e.in.drift = false;
  const gp = gapPos(e.s);
  if (gp > -1600 && gp < 0 && e.energy > 0.05) { e.in.boost = true; e.in.steer = clamp(-e.psi * 3 - e.d * 0.01, -1, 1); return; }

}

  S.raceTime += DT;
  for (const e of S.ents) {
    e.ev = {};

  const fi = S.finishOrder.indexOf(e);

function compile(type, src) {

}

function buildRoadMesh() {
  const { N, P, R, U, T } = TR, out = [];
  const pos = (i, d, up) => { i = (i + N) % N; return [P[i * 3] + R[i][0] * d + U[i][0] * up, P[i * 3 + 1] + R[i][1] * d + U[i][1] * up, P[i * 3 + 2] + R[i][2] * d + U[i][2] * up]; };

    const curb = (i >> 2) & 1, band = Math.floor(i / 6) & 1, steep = Math.abs(TR.bank[i]) > 45;
    for (let k = 0; k < 5; k++) {

      pushQuad(out, pos(i, e1, WALL_H), pos(j, e1, WALL_H), pos(j, e1, -ROAD_T), pos(i, e1, -ROAD_T), lit(COL.side, scale(Ri, sd)));
    }
    pushQuad(out, pos(i, -HW - WALL_T, -ROAD_T), pos(j, -HW - WALL_T, -ROAD_T), pos(j, HW + WALL_T, -ROAD_T), pos(i, HW + WALL_T, -ROAD_T), lit(COL.under, scale(Ui, -1), 0.4));

  gl.bindVertexArray(null);
  drawHud();
}

// ---------------------------------------------------------------- HUD met een eigen pixellettertype (3x5)
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111', F: '111100110100100',
  G: '011100101101011', H: '101101111101101', I: '111010010010111', J: '001001001101010', K: '101101110101101', L: '100100100100111',
  M: '101111111101101', N: '110101101101101', O: '010101101101010', P: '110101110100100', Q: '010101101110011', R: '110101110101101',
  S: '011100010001110', T: '111010010010010', U: '101101101101111', V: '101101101101010', W: '101101111111101', X: '101101010101101',
  Y: '101101010010010', Z: '111001010100111', 0: '111101101101111', 1: '010110010010111', 2: '110001010100111', 3: '110001010001110',
  4: '101101111001001', 5: '111100110001110', 6: '011100110101010', 7: '111001010010010', 8: '010101010101010', 9: '010101011001110',
  ':': '000010000010000', '.': '000000000000010', '/': '001001010100100', '-': '000000111000000', '!': '010010010000010',
  '?': '110001010000010', "'": '010010000000000', '+': '000010111010000', '%': '101001010100101', ',': '000000000010100'
};
function text(str, x, y, sc, col, align) {
  str = String(str).toUpperCase();
  const w = str.length * 4 * sc - sc;
  if (align === 'c') x -= w / 2; else if (align === 'r') x -= w;
  x = Math.round(x); y = Math.round(y);
  for (const pass of [0, 1]) {
    hx.fillStyle = pass ? col : '#14101e';
    const o = pass ? 0 : sc;
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]];
      if (!g) continue;
      for (let p = 0; p < 15; p++) if (g[p] === '1') hx.fillRect(x + i * 4 * sc + (p % 3) * sc + o, y + Math.floor(p / 3) * sc + o, sc, sc);
    }
  }
}
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
let mapPts = null;
function drawHud() {
  hx.clearRect(0, 0, W, H);
  const p = S.player, place = placeOf(p);
  text('LAP ' + Math.min(LAPS, Math.max(1, p.lap - 1)) + '/' + LAPS, 8, 8, 2, '#fff');
  text(fmt(S.raceTime), 8, 22, 2, '#ffd23a');
  if (p.best) text('BEST ' + fmt(p.best), 8, 36, 1, '#cfe');
  text(place + (['ST', 'ND', 'RD'][place - 1] || 'TH'), W - 8, 8, 3, place === 1 ? '#ffd23a' : '#fff', 'r');
  text('/' + S.ents.length, W - 8, 28, 1, '#cfe', 'r');
  // snelheid en boost
  text(Math.round(p.speed * 0.2) + ' KM/H', 8, H - 26, 2, '#fff');
  hx.fillStyle = '#14101e'; hx.fillRect(8, H - 11, 82, 6);
  hx.fillStyle = p.boosting ? '#7ff' : '#3af'; hx.fillRect(9, H - 10, Math.round(80 * p.energy), 4);
  const lv = driftLevel(p.driftT);
  if (p.driftT > 0) text('DRIFT' + '!!!'.slice(0, lv), 100, H - 12, 1, ['#fff', '#7ff', '#ff7', '#f8a'][lv]);
  if (p.slip && Math.abs(TR.bank[at(p.s, Q2).i]) > 40) text('TOO SLOW - SLIDING!', W / 2, H - 40, 1, '#f86', 'c');
  if (p.splashT > 0) text('SPLASH! TOO SLOW FOR THE JUMP', W / 2, H / 2 - 20, 2, '#7ef', 'c');
  if (p.ai) text('AUTOPILOT (P)', W / 2, 8, 1, '#7ff', 'c');
  // kaartje
  if (!mapPts) {
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
    for (let i = 0; i < TR.N; i++) { x0 = Math.min(x0, TR.P[i * 3]); x1 = Math.max(x1, TR.P[i * 3]); z0 = Math.min(z0, TR.P[i * 3 + 2]); z1 = Math.max(z1, TR.P[i * 3 + 2]); }
    mapPts = { x0, z0, k: 64 / Math.max(x1 - x0, z1 - z0), w: (x1 - x0), h: (z1 - z0) };
  }
  const mk = mapPts.k, mx = W - 8 - mapPts.w * mk, my = H - 8 - mapPts.h * mk;
  const mp = (x, z) => [Math.round(mx + (x - mapPts.x0) * mk), Math.round(my + (z - mapPts.z0) * mk)];
  hx.fillStyle = '#14101e';
  for (let i = 0; i < TR.N; i += 3) { const [x, y] = mp(TR.P[i * 3], TR.P[i * 3 + 2]); hx.fillRect(x - 1, y - 1, 3, 3); }
  for (let i = 0; i < TR.N; i += 3) { const [x, y] = mp(TR.P[i * 3], TR.P[i * 3 + 2]); hx.fillStyle = TR.P[i * 3 + 1] > 150 ? '#fff' : '#b8b0c8'; hx.fillRect(x, y, 1, 1); }
  for (const e of S.ents) {
    const fr = entFrame(e, {}), [x, y] = mp(fr.pos[0], fr.pos[2]);
    hx.fillStyle = e === p ? '#ffd23a' : e.pal[2]; hx.fillRect(x - 1, y - 1, 3, 3);
  }
  // aftellen en uitslag
  if (S.phase === 'count') {
    const n = 3 - Math.floor(S.t);
    text(n, W / 2, H / 2 - 30, 6, '#ffd23a', 'c');
    text('ARROWS / WASD: DRIVE   SPACE: BOOST   SHIFT: DRIFT', W / 2, H - 50, 1, '#fff', 'c');
    text('C: CHANGE SHIP   R: RESTART   P: AUTOPILOT', W / 2, H - 42, 1, '#cfe', 'c');
  } else if (S.phase === 'race' && S.t < 1) text('GO!', W / 2, H / 2 - 30, 6, '#7f7', 'c');
  if (S.phase === 'race' && p.lastLap && p.lapT < 2.5) text('LAP ' + fmt(p.lastLap), W / 2, 40, 2, '#fff', 'c');
  if (S.phase === 'done') {
    text('FINISH!', W / 2, H / 2 - 50, 5, '#ffd23a', 'c');
    text('PLACE ' + place + '   TIME ' + fmt(p.finishT), W / 2, H / 2 - 16, 2, '#fff', 'c');
    if (p.best) text('BEST LAP ' + fmt(p.best), W / 2, H / 2, 1, '#cfe', 'c');
    text('PRESS R TO RACE AGAIN', W / 2, H / 2 + 14, 1, '#fff', 'c');
  }
}

// ---------------------------------------------------------------- start
buildTrack();
buildRoadMesh();
ground = groundMesh();
buildDecor();
buildSky();
resize();
startRace();
let last = performance.now(), accT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  accT += dt;
  while (accT >= DT) { if (!S.paused) tick(); accT -= DT; }
  render(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// voor testen in de console
window.K3 = { S, TR, tick, startRace, at, snapCam: () => { camInit = false; }, cam };
</script>
