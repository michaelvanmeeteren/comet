    } else { e.vz -= (N - ADH - glue) * 0.95 * DT; e.z += e.vz * DT; }   // in de lucht: de zwaartekracht van komeet.html (760), de magneet telt niet
    e.airT += DT;
    if (e.z <= 0 && g1 > 0 && g1 < TR.gapL) {
      // in het water: terug voor de schans, met weinig vaart
      e.progress -= g1 + 900; e.s -= g1 + 900;
      e.z = 0; e.vz = 0; e.air = false; e.gapFly = false; e.vT = 250; e.vR = 0; e.psi = 0; e.d *= 0.5; e.splashT = 1.6; e.ev.splash = 1;
    } else if (e.z <= 0) {
      e.z = 0; e.vz = 0; e.air = false; e.gapFly = false; e.ev.land = 1;
      if (e.airT > 0.6) { e.padT = Math.max(e.padT, 0.5); e.vT += 120; }
    }
  }
  // gevaren onder het schip
  const sh = ((e.s % TR.len) + TR.len) % TR.len;
  if (e.z < 1) for (const hz of TR.haz) {
    if (sh < hz.s0 || sh > hz.s1) continue;
    if (hz.type === 'wave') {
      const cw = waveAt(hz, HW, S.raceTime);
      if (cw !== null && Math.abs(e.d - cw) < WAVE_HW) {
        if (e.speed > 360) { const k2 = 1 - (1 - 360 / e.speed) * 2.8 * DT; e.vT *= k2; e.vR *= k2; }
        e.vR += hz.dir * 320 * DT; e.ev.wave = 1;
      }
    } else if (hz.type === 'current') { e.vR += hz.dir * 480 * DT; e.ev.current = 1; }
    else if (hz.type === 'wisp') { if (Math.abs(e.d - wispD(hz, HW, S.raceTime)) < 70 && e.speed > 450) { const k3 = 1 - 1.6 * DT; e.vT *= k3; e.vR *= k3; e.ev.wisp = 1; } }
    else if (hz.type === 'geyser') { if (geyserOn(hz, S.raceTime) && !e.air) { e.air = true; e.vz = 560; e.airT = 0; e.vT *= 0.9; e.ev.jump = 1; } }
    else if (hz.type === 'gap' && !e.air) {
      const back = sh - (hz.s0 - GAP_BACK);
      e.s -= back; e.progress -= back; e.d = clamp(e.d, -HW * 0.5, HW * 0.5);
      e.vT = 450; e.vR = 0; e.psi = 0; e.vz = 0; e.z = 0; e.padT = 0; e.driftT = 0; e.energy = Math.max(e.energy, 0.5); e.ev.fall = 1;
      return;
    }
  }
  // schans en hobbels: het schip rijdt de helling op (z volgt het wegdek van de wig) en komt pas aan de rand los
  let ramp = 0;
  if (!e.gapFly) for (const hz of TR.haz) {
    if (hz.type === 'jump' && !(hz.route && routeOf(e, sh) !== hz.route)) {
      const a0 = hz.s0 - 60, Hh = hz.launch ? 34 : 24;
      if (!e.air && sh >= a0 && sh < hz.s1) ramp = Math.max(ramp, Hh * (sh - a0) / (hz.s1 - a0));
      else if (e.rampH && sh >= hz.s1 && sh < hz.s1 + 60) {
        e.air = true; e.z = e.rampH; e.airT = 0; e.ev.jump = 1; e.rampH = 0;
        e.vz = e.vT > 350 ? (hz.gap ? 150 + e.vT * 0.13 : 110 + e.vT * 0.11) : 0;   // te langzaam: je valt er gewoon af
      }
    } else if (hz.type === 'bump') {
      const m = (hz.s0 + hz.s1) / 2, half = (hz.s1 - hz.s0) / 2 + 10;
      if (e.air || Math.abs(sh - m) >= half) continue;
      if (sh < m) ramp = Math.max(ramp, 12 * (1 - (m - sh) / half));
      else if (e.rampH && e.vT > 300) { e.air = true; e.z = e.rampH; e.vz = 60 + e.vT * 0.045; e.airT = 0; e.ev.bump = 1; e.rampH = 0; }
      else ramp = Math.max(ramp, 12 * (1 - (sh - m) / half));
    }
  }
  if (!e.air) { if (ramp > 0) e.z = ramp; e.rampH = ramp; }
  if (!e.air) {
    if (e.padT < 0.9) for (const p of TR.pads) {
      let dsv = sh - p.s; dsv -= Math.round(dsv / TR.len) * TR.len;
      if (Math.abs(e.d - p.d) < PAD_HW + 12 && Math.abs(dsv) < PAD_HL) {
        e.padT = 1.25; e.vT += Math.cos(e.psi) * 220; e.vR += Math.sin(e.psi) * 220; e.ev.pad = 1; break;
      }
    }
  }
  // vangrail
  const maxD = HW - SHIP_R, rc = route ? routeC(e.s, route) : 0;   // bij een splitsing: wanden van de eigen route
  e.d -= rc;
  if (Math.abs(e.d) <= maxD - 2) e.onWall = false;
  if (Math.abs(e.d) > maxD) {
    const sd = Math.sign(e.d);
    e.d = sd * maxD;
    const vn = e.vR * sd;
    if (vn > 0) {
      // klap tegen de rail: snelheid kwijt alleen bij het raken zelf (of een harde klap), niet bij elke stap erlangs
      if (vn > 120) e.ev.wall = 1;
      if (!e.onWall) { e.vT *= 1 - Math.min(0.45, vn / 1400) / e.car.tough; e.driftT = 0; }
      e.vR = -e.vR * 0.3;
    }
    // de neus kan maar een klein stukje de rail in wijzen: zo schuur je erlangs en blijf je niet plakken
    if (e.psi * sd > 0.3) e.psi = sd * 0.3;
    e.onWall = true;
    e.d = sd * (maxD - 0.5);
    e.vT *= 1 - 0.6 * DT;
  }
  e.d += rc;
  e.psi = Math.atan2(Math.sin(e.psi), Math.cos(e.psi));
}

// botsen tussen schepen, in baancoordinaten (dus niet met iemand op de brug boven je)
function collide(ents) {
  for (let i = 0; i < ents.length; i++) for (let j = i + 1; j < ents.length; j++) {
    const a = ents[i], b = ents[j];
    let dsv = b.s - a.s; dsv -= Math.round(dsv / TR.len) * TR.len;
    const dd = b.d - a.d;
    if (Math.abs(dsv) > 70 || Math.abs(dd) > 44 || Math.abs(a.z - b.z) > 40) continue;
    const ox = 70 - Math.abs(dsv), oy = 44 - Math.abs(dd);
    a.ev.bumped = b; b.ev.bumped = a;
    const ma = a.car.mass, mb = b.car.mass, wa = mb / (ma + mb), wb = ma / (ma + mb);
    if (oy < ox * 0.63) {
      const sd = Math.sign(dd || 1);
      a.d -= sd * oy * wa; b.d += sd * oy * wb;
      const rv = b.vR - a.vR;
      if (rv * sd < 0) { a.vR += rv * wa * 1.2; b.vR -= rv * wb * 1.2; }
    } else {
      const sd = Math.sign(dsv || 1);
      a.s -= sd * ox * wa; b.s += sd * ox * wb; a.progress -= sd * ox * wa; b.progress += sd * ox * wb;
      const rv = b.vT - a.vT;
      if (rv * sd < 0) { a.vT += rv * wa * 1.1; b.vT -= rv * wb * 1.1; }
    }
  }
}

// computerrijders: richten op een lijn aan de binnenkant van de bocht verderop
function aiInput(e, ents) {
  // elastiek: ver voor de speler wat inhouden, ver achter harder (alleen rivalen in een race)
  if (e.rival != null && S.player && !S.player.ai) {
    const gap = e.progress - S.player.progress, cl = CLASSES[S.mul > 1.05 ? 2 : S.mul < 0.95 ? 0 : 1];
    const want = gap > 600 ? 1 - (1 - cl.lead) * Math.min(1, (gap - 600) / 2500) : gap < -600 ? 1 + (cl.chase - 1) * Math.min(1, (-gap - 600) / 2500) : 1;
    e.rb = (e.rb || 1) + (want - (e.rb || 1)) * Math.min(1, DT * 0.5);
  }
  at(e.s + 240 + Math.max(0, e.vT) * 0.35, Q2);
  let target = clamp(Q2.kg * 70000, -HW * 0.6, HW * 0.6) + e.lane;
  for (const o of ents) {
    if (o === e) continue;
    let dsv = o.s - e.s; dsv -= Math.round(dsv / TR.len) * TR.len;
    if (dsv > 0 && dsv < 220 && Math.abs(o.d - e.d) < 60 && o.vT < e.vT + 40) target = o.d + (o.d > e.d ? -75 : 75);
  }
  // om modder heen (zoals aiControl in komeet.html)
  const sa = ((e.s % TR.len) + TR.len) % TR.len;
  for (const hz of TR.haz) {
    if (hz.type !== 'slow' || hz.s1 < sa - 40 || hz.s0 > sa + 300 + e.speed * 0.5) continue;
    target = hz.d1 >= HW - 1 ? Math.min(target, hz.d0 - 45) : Math.max(target, hz.d1 + 45);
  }
  if (e.rival != null) for (const p of TR.pads) { let dp = p.s - sa; dp -= Math.round(dp / TR.len) * TR.len; if (dp > 150 && dp < 900 && Math.abs(Q2.kg) < 0.0006) { target = p.d; break; } }
  if (TR.split) {
    const sp = TR.split, sAh = ((e.s + 240 + Math.max(0, e.vT) * 0.35) % TR.len + TR.len) % TR.len;
    if (sa > sp.s1 + 400 || sa < sp.s0 - 2600) e.routePref = null;
    if (sAh > sp.s0 - 1500 && sAh < sp.s1) {
      if (e.routePref == null) e.routePref = Math.random() < 0.5 ? -1 : 1;
      target = e.routePref * Math.max(85, Math.abs(routeC(sAh, e.routePref))) + clamp(Q2.kg * 40000, -40, 40);   // aan de gekozen kant blijven tot de routes uit elkaar zijn
    }
  }
  for (const hz of TR.haz) if (hz.type === 'wisp' && hz.s0 - sa > -60 && hz.s0 - sa < 500) { const wd = wispD(hz, HW, S.raceTime); if (Math.abs(target - wd) < 90) target = wd > 0 ? wd - 100 : wd + 100; }
  { const rc2 = TR.split ? routeC(e.s, routeOf(e, e.s)) : 0; target = clamp(target - rc2, -HW + 40, HW - 40) + rc2; }
  const want = Math.atan2(target - e.d, 320);
  e.in.steer = clamp((want - e.psi) * 3, -1, 1);
  e.in.acc = true; e.in.brk = false; e.in.drift = false;
  // voor een lavagat: met vaart erheen
  const sm2 = ((e.s % TR.len) + TR.len) % TR.len;
  const lava = e.energy > 0.05 && TR.haz.some(h => h.gap && h.s0 - sm2 > 0 && h.s0 - sm2 < 1100);
  const gp = gapPos(e.s);
  if (gp > -1600 && gp < 0 && e.energy > 0.05) { e.in.boost = true; e.in.steer = clamp(-e.psi * 3 - e.d * 0.01, -1, 1); return; }
  e.in.boost = lava || e.energy > (e.rival != null ? 0.3 : 0.5) && Math.abs(Q2.kg) < (e.rival != null ? 0.0004 : 0.00025) && e.speed > 600 && (e.boostWish = (e.boostWish || 0) + DT) > (e.rival != null ? 0.6 : 2);
  if (!e.in.boost && e.energy < 0.1) e.boostWish = 0;
}

    const rows = f.g[str[c]];
    if (rows) {
      for (let r = 0; r < f.h; r++) {
        const bits = rows[r];
        if (!bits) continue;
        // aaneengesloten pixels in een rij als één rechthoek
        let run = -1;
        for (let b = 0; b <= f.w; b++) {
          const on = b < f.w && (bits >> (f.w - 1 - b)) & 1;
          if (on && run < 0) run = b;
          else if (!on && run >= 0) { hx.fillRect(x + (c * (f.w + 1) + run) * k, y + r * k, (b - run) * k, k); run = -1; }
        }
      }
    }
  }
  return str.length * adv - k;
}

// tekst met de linkerbovenhoek op (x, y); sc 1 = klein (3x5), 2 = gewoon (5x7), groter = het 5x7-lettertype vergroot
const fmt = t => { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
let mapPts = null;
function trackOutline(def) {
  const keepTR = Object.assign({}, TR), keepHW = HW;
  buildTrack(def, TRACKS_OUTER.indexOf(def));
  const P = TR.P, N = TR.N, raw = [];
  for (let i = 0; i < N; i++) raw.push([P[i * 3], P[i * 3 + 2], P[i * 3 + 1]]);
  for (const k in TR) delete TR[k];
  Object.assign(TR, keepTR); HW = keepHW;
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (const [x, z] of raw) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
  // stukken die over een ander stuk weg heen gaan (brug): die komen er in het voorbeeld bovenop
  const over = [], r2 = (def.hw * 2.4) ** 2;
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j += 2) {
    if (Math.abs(i - j) < 40 || N - Math.abs(i - j) < 40) continue;
    const dx = raw[i][0] - raw[j][0], dz = raw[i][1] - raw[j][1];
    if (dx * dx + dz * dz < r2 && raw[i][2] > raw[j][2] + 70) { over.push(raw[i]); break; }
  }
  const sh = ([x, z]) => [x - x0, z - z0];
  return { pts: raw.map(sh), over: over.map(sh), w: x1 - x0, h: z1 - z0, span: Math.max(x1 - x0, z1 - z0) };
}

// ---------------------------------------------------------------- start
// Afstandskaart voor de grond: per vakje de afstand tot de voet van de helling naast de weg (of de weg zelf, bij een brug).
// Eerst de baan in het raster zetten, dan twee keer langs (heen en terug) de afstanden doorgeven.
let distMap = null;
function buildDistMap() {
  const n = 384, half = TR.center[2] + 600, x0 = TR.center[0] - half, z0 = TR.center[1] - half, cell = 2 * half / n;
  const d = new Float32Array(n * n).fill(1e9);
  for (let i = 0; i < TR.N; i += 2) {   // om het andere punt: de vakjes zijn groter dan de afstand tussen twee punten
    if (TR.loop[i]) continue;
    const hh = Math.max(0, TR.P[i * 3 + 1] - GROUND_Y), foot = HW + WALL_T + Math.min(BERM, hh * 4) + hh * 1.1;   // berm plus helling
    const r = Math.ceil(foot / cell) + 1, cx = (TR.P[i * 3] - x0) / cell, cz = (TR.P[i * 3 + 2] - z0) / cell;
    for (let y = Math.max(0, Math.floor(cz - r)); y <= Math.min(n - 1, Math.ceil(cz + r)); y++)
      for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(n - 1, Math.ceil(cx + r)); x++) {
        const v = Math.hypot(x - cx, y - cz) * cell - foot;
        if (v < d[y * n + x]) d[y * n + x] = v;
      }
  }
  // chamfer-afstand voor de rest
  const D1 = cell, D2 = cell * Math.SQRT2;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let v = d[y * n + x];
    if (x > 0) v = Math.min(v, d[y * n + x - 1] + D1);
    if (y > 0) { v = Math.min(v, d[(y - 1) * n + x] + D1); if (x > 0) v = Math.min(v, d[(y - 1) * n + x - 1] + D2); if (x < n - 1) v = Math.min(v, d[(y - 1) * n + x + 1] + D2); }
    d[y * n + x] = v;
  }
  for (let y = n - 1; y >= 0; y--) for (let x = n - 1; x >= 0; x--) {
    let v = d[y * n + x];
    if (x < n - 1) v = Math.min(v, d[y * n + x + 1] + D1);
    if (y < n - 1) { v = Math.min(v, d[(y + 1) * n + x] + D1); if (x < n - 1) v = Math.min(v, d[(y + 1) * n + x + 1] + D2); if (x > 0) v = Math.min(v, d[(y + 1) * n + x - 1] + D2); }
    d[y * n + x] = v;
  }
  const bytes = new Uint8Array(n * n);
  for (let k = 0; k < n * n; k++) bytes[k] = Math.max(0, Math.min(255, Math.round(d[k] / 8)));
  if (!distMap) distMap = { tex: gl.createTexture() };
  gl.bindTexture(gl.TEXTURE_2D, distMap.tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, n, n, 0, gl.RED, gl.UNSIGNED_BYTE, bytes);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  distMap.box = [x0, z0, 2 * half];
}

// een baan laden: lint, decor en lucht opnieuw opbouwen
// boostpads waar je toch altijd door de lucht vliegt (na een schans of top) weghalen: de computer rijdt een ronde
// normaal en een ronde met steeds boost, en houdt bij waar hij los van de weg is (per baan een keer, daarna bewaard)
const airCache = {};
function dropAirPads() {
  let air = airCache[TR.def.id];
  if (!air) {
    air = new Uint8Array(TR.N); const keepT = S.raceTime;
    for (const boostAll of [false, true]) {
      const e = newEnt(CARS[1], CARS[1].pal, true, TR.len - 70, 0, 1.02); e.item = null; let n = 0;
      while (e.progress < TR.len * 1.02 && n < 200 / DT) { S.raceTime = n * DT; e.ev = {}; aiInput(e, [e]); if (boostAll) { e.in.boost = true; e.energy = 1; } stepEnt(e); n++;
        if (e.air) air[Math.floor((((e.s % TR.len) + TR.len) % TR.len) / TR.step) % TR.N] = 1; }
    }
    S.raceTime = keepT; airCache[TR.def.id] = air;
  }
  TR.pads = TR.pads.filter(p => { const i = Math.floor((((p.s % TR.len) + TR.len) % TR.len) / TR.step); for (let k = -3; k <= 3; k++) if (air[(i + k + TR.N) % TR.N]) return false; return true; });
}
function loadTrack(idx, intro) {
  const NT = TRACKS.length - 1; idx = 1 + ((idx - 1) % NT + NT) % NT;   // 0 was de testbaan, die is eruit
  buildTrack(TRACKS[idx], idx);
  let cx = 0, cz = 0, rr = 0;
  for (let i = 0; i < TR.N; i++) { cx += TR.P[i * 3] / TR.N; cz += TR.P[i * 3 + 2] / TR.N; }
  for (let i = 0; i < TR.N; i++) rr = Math.max(rr, Math.hypot(TR.P[i * 3] - cx, TR.P[i * 3 + 2] - cz));
  TR.center = [cx, cz, rr + 1400];
  buildDistMap();
  if (roadMesh) gl.deleteVertexArray(roadMesh.vao);
  for (const g of decor) { if (g.vao) gl.deleteVertexArray(g.vao); g.dead = true; }   // plaatjes blijven bewaard (texCache)
  if (skyTex) { skyTex.dead = true; gl.deleteTexture(skyTex.tex); }
  decor = []; mapPts = null;
  TR.haz = []; TR.pads = [];
  if (TR.idx > 0) { placeHaz3d(); dropAirPads(); }
  buildRoadMesh(); buildDecor(); buildSky();
  startRace(intro);
}
ground = groundMesh();
resize();
loadTrack(ui.bg);
let last = performance.now(), accT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  accT += dt;
  while (accT >= DT) { if (!S.paused && !((S.optPause || S.userPause) && G3.state !== 'menu' && G3.mode !== 'online')) tick(); accT -= DT; }
  titleTick(dt);
  render(dt);
  musicSync(dt);
  engineSync(S.player.speed, S.player.in.acc ? 1 : 0, S.player.boosting, S.phase !== 'done' && G3.state !== 'menu');
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// voor testen in de console
window.K3 = { S, TR, tick, startRace, at, loadTrack, G3, ui, menuKey, raceKey, NET, snapCam: () => { camInit = false; }, cam };
</script>
