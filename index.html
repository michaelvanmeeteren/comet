function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function crom(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
}

let T = null;   // de actieve baan

function posAt(s, tr) {
  tr = tr || T;
  s = ((s % tr.len) + tr.len) % tr.len;
  let lo = 0, hi = tr.N - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (tr.SC[mid] <= s) lo = mid; else hi = mid - 1;
  }
  const t = (s - tr.SC[lo]) / tr.SL[lo];
  return { x: tr.SX[lo] + tr.TX[lo] * tr.SL[lo] * t, y: tr.SY[lo] + tr.TY[lo] * tr.SL[lo] * t, tx: tr.TX[lo], ty: tr.TY[lo], i: lo };
}

const near = { i: 0, d: 0, s: 0, qx: 0, qy: 0 };
function nearest(x, y, hint, win) {
  const N = T.N, SX = T.SX, SY = T.SY, TX = T.TX, TY = T.TY, SL = T.SL;
  let best = 1e18;
  for (let k = -win; k <= win; k++) {
    const i = ((hint + k) % N + N) % N;
    const px = x - SX[i], py = y - SY[i];
    let t = (px * TX[i] + py * TY[i]) / SL[i];
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const qx = SX[i] + TX[i] * SL[i] * t, qy = SY[i] + TY[i] * SL[i] * t;
    const d2 = (x - qx) * (x - qx) + (y - qy) * (y - qy);
    if (d2 < best) {
      best = d2;
      near.i = i; near.qx = qx; near.qy = qy;
      near.s = T.SC[i] + SL[i] * t;
      near.d = Math.sqrt(d2) * ((TX[i] * py - TY[i] * px) >= 0 ? 1 : -1);
    }
  }
  return near;
}

function blockIntrusion(hz, s) {
  return hz.depth * Math.max(0, Math.min(1, (s - hz.s0) / BLOCK_TAPER, (hz.s1 - s) / BLOCK_TAPER));
}

function buildTrack(def, index) {
  const cp = def.pts, n = cp.length, SXa = [], SYa = [];
  for (let i = 0; i < n; i++) {
    const p0 = cp[(i - 1 + n) % n], p1 = cp[i], p2 = cp[(i + 1) % n], p3 = cp[(i + 2) % n];
    const steps = Math.ceil(Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 10);
    for (let k = 0; k < steps; k++) {
      const t = k / steps;
      SXa.push(crom(p0[0], p1[0], p2[0], p3[0], t));
      SYa.push(crom(p0[1], p1[1], p2[1], p3[1], t));
    }
  }
  const N = SXa.length;
  // Te krappe bochten worden afgerond door de lijn glad te strijken tot de kleinste straal ruim genoeg is.
  let tr = null;
  for (let win = 0; win <= 90; win += 5) {
    tr = measureTrack(def, index, smoothLoop(SXa, win), smoothLoop(SYa, win));
    let maxK = 0;
    for (let i = 0; i < N; i++) maxK = Math.max(maxK, Math.abs(tr.K[i]));
    if (1 / maxK >= (def.minR || def.hw + 150)) break;
  }
  placeHazards(tr, def, 1337 + index * 7919);
  return tr;
}

function smoothLoop(arr, win) {
  const n = arr.length, out = new Float32Array(n);
  if (!win) { out.set(arr); return out; }
  // twee keer een voortschrijdend gemiddelde geeft een vloeiende (driehoekige) weging
  let cur = arr;
  for (let pass = 0; pass < 2; pass++) {
    const nxt = new Float32Array(n);
    let sum = 0;
    for (let k = -win; k <= win; k++) sum += cur[((k % n) + n) % n];
    for (let i = 0; i < n; i++) {
      nxt[i] = sum / (2 * win + 1);
      sum += cur[(i + win + 1) % n] - cur[((i - win) % n + n) % n];
    }
    cur = nxt;
  }
  out.set(cur);
  return out;
}

function measureTrack(def, index, SX, SY) {
  const N = SX.length;
  const tr = { def, index, id: def.id, name: def.name, cup: def.cup, hw: def.hw, N, SX, SY,
    SL: new Float32Array(N), SC: new Float32Array(N + 1), TX: new Float32Array(N), TY: new Float32Array(N), K: new Float32Array(N) };
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    const dx = SX[j] - SX[i], dy = SY[j] - SY[i];
    tr.SL[i] = Math.hypot(dx, dy);
    tr.TX[i] = dx / tr.SL[i]; tr.TY[i] = dy / tr.SL[i];
    tr.SC[i + 1] = tr.SC[i] + tr.SL[i];
  }
  tr.len = tr.SC[N];
  tr.period = tr.len / Math.round(tr.len / PERIOD_TARGET);
  tr.spacing = tr.len / N;
  // kromming (positief = bocht naar rechts)
  const w = 6;
  for (let i = 0; i < N; i++) {
    const a = ((i - w) % N + N) % N, b = (i + w) % N;
    let dth = Math.atan2(tr.TY[b], tr.TX[b]) - Math.atan2(tr.TY[a], tr.TX[a]);
    dth = Math.atan2(Math.sin(dth), Math.cos(dth));
    let ds = tr.SC[b] - tr.SC[a]; if (ds < 0) ds += tr.len;
    tr.K[i] = dth / ds;
  }
  return tr;
}

// Gevaren en boostpads worden automatisch op passende plekken gelegd (vast per baan).
function placeHazards(tr, def, seed) {
  const rnd = mulberry32(seed), L = tr.len, hw = tr.hw, haz = [], pads = [], occ = [];
  const want = def.haz || {};
  const kStat = (a, b) => {
    let mx = 0, sum = 0, sg = 0, cnt = 0;
    for (let s = a; s <= b; s += 20) { const k = tr.K[posAt(s, tr).i]; mx = Math.max(mx, Math.abs(k)); sum += Math.abs(k); sg += k; cnt++; }
    return { mx, mean: sum / cnt, sign: sg >= 0 ? 1 : -1 };
  };
  const free = (a, b, m) => a >= 500 && b <= L - 700 && !occ.some(o => a < o[1] + m && b > o[0] - m);
  const scan = (count, len, gap, ok, make) => {
    let placed = 0;
    for (let pass = 0; pass < 3 && placed < count; pass++) {
      for (let s = 500 + rnd() * 500; s < L - 700 - len && placed < count; s += 70) {
        if (!free(s, s + len, gap)) continue;
        const ks = kStat(s, s + len);
        if (!ok(ks, pass)) continue;
        occ.push([s, s + len]);
        make(s, ks);
        placed++;
        s += Math.max(len + gap, L / (count + 1) * 0.75);
      }
    }
  };
  scan(want.jump || 0, 950, 200, (k, p) => k.mx < [1 / 1900, 1 / 1300, 1 / 900][p],
    s => haz.push({ type: 'jump', s0: s + 60, s1: s + 100 }));
  scan(want.block || 0, 460, 260, (k, p) => k.mx < [1 / 1400, 1 / 900, 1 / 600][p],
    s => haz.push({ type: 'block', s0: s, s1: s + 460, side: rnd() < 0.5 ? -1 : 1, depth: hw * 0.86 }));
  scan(want.ice || 0, 560, 260, (k, p) => k.mx < 1 / 430 && (p > 0 || k.mean > 1 / 4000),
    s => haz.push({ type: 'ice', s0: s, s1: s + 560 }));
  scan(want.slow || 0, 320, 220, (k, p) => k.mx < 1 / 470 && (p > 0 || k.mean > 1 / 1900),
    (s, k) => haz.push({ type: 'slow', s0: s, s1: s + 320, d0: k.sign > 0 ? -0.05 * hw : -hw, d1: k.sign > 0 ? hw : 0.05 * hw }));
  scan(Math.min(8, want.pads || 0), 170, 200, (k, p) => k.mx < [1 / 900, 1 / 600, 1 / 400][p],
    s => {
      const p = posAt(s + 85, tr), off = [-0.4, 0, 0.4][Math.floor(rnd() * 3)] * hw;
      pads.push({ x: p.x - p.ty * off, y: p.y + p.tx * off, dx: p.tx, dy: p.ty });
    });
  scan(want.chain || 0, 760, 260, (k, p) => k.mx < [1 / 2200, 1 / 1500, 1 / 1000][p],
    s => {
      const off = [-0.42, 0, 0.42][Math.floor(rnd() * 3)] * hw;
      for (let i = 0; i < 3; i++) {
        const q = posAt(s + 90 + i * 260, tr);
        pads.push({ x: q.x - q.ty * off, y: q.y + q.tx * off, dx: q.tx, dy: q.ty });
      }
    });
  tr.haz = haz; tr.pads = pads;
}

function newEntity(car, opts) {
  return Object.assign({
    car, x: 0, y: 0, th: 0, vx: 0, vy: 0, z: 0, vz: 0, vl: 0, steer: 0,
    hint: 0, s: 0, d: 0, lastS: null, progress: 0, lap: 0, finished: false, finishTime: 0,
    energy: 1, padT: 0, driftT: 0, boosting: false, onIce: false, onSlow: false,
    skill: 1, ai: false, ref: false, lane: 0, laneS: 0, stuck: 0, hits: 0,
    in: { acc: false, brk: false, drift: false, steer: 0, boost: false },
    ev: { hit: 0, pad: 0, jump: 0, land: 0, bump: 0, drift: 0 }, trail: []
  }, opts || {});
}

function placeOnGrid(e, back, lateral) {
  const p = posAt(T.len - back);
  e.x = p.x - p.ty * lateral; e.y = p.y + p.tx * lateral;
  e.th = Math.atan2(p.ty, p.tx);
  e.vx = e.vy = 0; e.z = e.vz = 0;
  const nr = nearest(e.x, e.y, p.i, 30);
  e.hint = nr.i; e.s = nr.s; e.d = nr.d; e.lastS = null;
  e.progress = -back; e.lap = 0; e.finished = false;
  e.laneS = lateral;
}

function stepEntity(e) {
  const c = e.car, k = e.skill, inp = e.in, hw = T.hw;
  e.steer += (inp.steer - e.steer) * Math.min(1, DT * 9);
  const air = e.z > 0.01;

  // ondergrond (op basis van de vorige positie)
  let onIce = false, onSlow = false;
  if (!air) {
    for (const hz of T.haz) {
      if (e.s < hz.s0 || e.s > hz.s1) continue;
      if (hz.type === 'ice') onIce = true;
      else if (hz.type === 'slow' && e.d >= hz.d0 && e.d <= hz.d1) onSlow = true;
    }
  }
  e.onIce = onIce; e.onSlow = onSlow;

  let fx = Math.cos(e.th), fy = Math.sin(e.th);
  let vf = e.vx * fx + e.vy * fy;
  let turn = inp.drift ? c.turn * 1.43 : c.turn;
  if (onIce) turn *= 0.8;
  if (air) turn *= 0.45;
  const rate = turn * e.steer * (0.3 + 0.7 * Math.min(1, Math.abs(vf) / 260)) / (1 + Math.max(0, vf) / 3600);
  e.th += rate * DT * (vf < -5 ? -1 : 1);
  fx = Math.cos(e.th); fy = Math.sin(e.th);
  const rx = -fy, ry = fx;
  vf = e.vx * fx + e.vy * fy;
  let vl = e.vx * rx + e.vy * ry;

  // driften met een stevige bocht laadt op; bij loslaten een boost, groter naarmate je langer drifte
  // (even minder sturen pauzeert het opladen; tegen de muur, op ijs of in de lucht vervalt de lading zonder boost)
  if (inp.drift && !air && !onIce && vf > 380) { if (Math.abs(e.steer) > 0.35) e.driftT += DT; }
  else if (!inp.drift) {
    const lv = driftLevel(e.driftT);
    if (lv) { e.padT = Math.max(e.padT, [0, 0.45, 0.8, 1.15][lv]); vf += [0, 90, 150, 210][lv]; e.ev.drift = lv; }
    e.driftT = 0;
  } else e.driftT = 0;
  if (e.padT > 0) e.padT -= DT;
  const manual = inp.boost && inp.acc && e.energy > 0.01 && !air;
  if (manual) e.energy = Math.max(0, e.energy - c.drain * DT);
  else e.energy = Math.min(1, e.energy + 0.055 * DT);
  e.boosting = manual || e.padT > 0;

  const top = (e.boosting ? c.boostTop : c.top) * k;
  if (inp.acc) vf += (e.boosting ? c.boostAcc : c.acc) * (1 - vf / top) * (air ? 0.3 : 1) * DT;
  else vf -= vf * 0.4 * DT;
  if (!e.boosting && vf > c.top * k) vf -= (vf - c.top * k) * 1.2 * DT;
  if (inp.brk && !air) vf = Math.max(-160, vf - 950 * (onIce ? 0.4 : 1) * DT);
  if (inp.drift && !air) vf -= vf * 0.12 * DT;
  if (onSlow && vf > 420) vf -= (vf - 420) * 2.4 * DT;
  let grip = (inp.drift ? 2.0 : c.grip) * (T.gripMul || 1);
  if (onIce) grip = Math.min(grip, 0.9);
  if (air) grip = 0.15;
  vl *= Math.exp(-grip * DT);
  e.vl = vl;

  e.vx = fx * vf + rx * vl; e.vy = fy * vf + ry * vl;
  e.x += e.vx * DT; e.y += e.vy * DT;

  if (air || e.vz > 0) {
    e.vz -= 760 * DT; e.z += e.vz * DT;
    if (e.z <= 0) { e.z = 0; e.vz = 0; e.ev.land = 1; }
  }

  const nr = nearest(e.x, e.y, e.hint, 45);
  const si = nr.i;
  e.hint = si;
  if (e.lastS != null) {
    let ds = nr.s - e.lastS;
    if (ds < -T.len / 2) ds += T.len; else if (ds > T.len / 2) ds -= T.len;
    e.progress += ds;
  }
  e.lastS = nr.s; e.s = nr.s; e.d = nr.d;

  // vangrail en versmallingen
  let maxD = hw - SHIP_R, minD = -maxD, blockHit = false;
  if (e.z < 22) {
    for (const hz of T.haz) {
      if (hz.type !== 'block' || e.s < hz.s0 || e.s > hz.s1) continue;
      const intr = blockIntrusion(hz, e.s);
      if (hz.side > 0) { const m = hw - intr - SHIP_R; if (m < maxD) { maxD = m; blockHit = true; } }
      else { const m = -(hw - intr) + SHIP_R; if (m > minD) { minD = m; blockHit = true; } }
    }
  }
  if (e.d > maxD || e.d < minD) {
    const sgn = e.d > maxD ? 1 : -1;
    const over = sgn > 0 ? e.d - maxD : minD - e.d;
    const nx = -T.TY[si] * sgn, ny = T.TX[si] * sgn;
    e.x -= nx * over; e.y -= ny * over; e.d -= sgn * over;
    const vn = e.vx * nx + e.vy * ny;
    if (vn > 0) {
      e.vx -= 1.35 * vn * nx; e.vy -= 1.35 * vn * ny;
      const loss = Math.min(0.45, vn / 1400) / c.tough;
      e.vx *= 1 - loss; e.vy *= 1 - loss;
      if (vn > 40) {
        const q = Math.min(1, vn / 500);
        e.ev.hit = Math.max(e.ev.hit, q);
        e.energy = Math.max(0, e.energy - 0.04 * q / c.tough);
        e.hits++;
      }
    }
    const scrape = (blockHit ? 2.6 : 0.6) * DT;
    e.vx *= 1 - scrape; e.vy *= 1 - scrape;
    if (blockHit && Math.hypot(e.vx, e.vy) > 300) e.ev.hit = Math.max(e.ev.hit, 0.25);
  }

  if (!air) {
    for (const hz of T.haz) {
      if (hz.type === 'jump' && e.s >= hz.s0 && e.s <= hz.s1 && vf > 350) {
        e.vz = 110 + vf * 0.11; e.z = 0.02; e.ev.jump = 1;
        break;
      }
    }
    if (e.padT < 0.9) {
      for (const p of T.pads) {
        const ex = e.x - p.x, ey = e.y - p.y;
        const ly = ex * p.dx + ey * p.dy, lx = -ex * p.dy + ey * p.dx;
        if (Math.abs(lx) < PAD_HW + 12 && Math.abs(ly) < PAD_HL) {
          e.padT = 1.25; e.vx += fx * 220; e.vy += fy * 220; e.ev.pad = 1;
          break;
        }
      }
    }
  }
}

let AI_GRIP = 1.22;
function cornerSpeed(R, car) {
  const t = car.turn * AI_GRIP;
  return (-1 + Math.sqrt(1 + 4 * R * t / 3600)) * 1800;
}

// Computerbestuurder: volgt een rijlijn, remt voor bochten en ontwijkt versmallingen.
const aiNear = [];
function aiControl(e) {
  const sp = Math.hypot(e.vx, e.vy), hw = T.hw, inp = e.in;
  const look = 150 + sp * 0.3;
  let lo = -(hw - 55), hi = hw - 55;
  // gevaren van dichtbij naar ver; past een verder gevaar niet meer bij het dichtste (slalom), dan eerst het dichtste nemen
  const near = aiNear;
  near.length = 0;
  for (const hz of T.haz) {
    if (hz.type !== 'block' && hz.type !== 'slow') continue;
    let a = hz.s0 - e.s; if (a < -T.len / 2) a += T.len;
    const b = a + (hz.s1 - hz.s0);
    if (b < -40 || a > look + 320) continue;
    near.push([a, hz]);
  }
  near.sort((p, q) => p[0] - q[0]);
  for (const [, hz] of near) {
    const lo0 = lo, hi0 = hi;
    if (hz.type === 'block') {
      if (hz.side > 0) hi = Math.min(hi, hw - hz.depth - 48); else lo = Math.max(lo, -(hw - hz.depth) + 48);
    } else {
      if (hz.d1 >= hw - 1) hi = Math.min(hi, hz.d0 - 40); else lo = Math.max(lo, hz.d1 + 40);
    }
    if (lo > hi - 20) { lo = lo0; hi = hi0; break; }
  }
  const lane = Math.max(lo, Math.min(hi, e.lane));
  e.laneS += (lane - e.laneS) * Math.min(1, DT * 4);
  const p = posAt(e.s + look);
  let d = Math.atan2(p.y + p.tx * e.laneS - e.y, p.x - p.ty * e.laneS - e.x) - e.th;
  d = Math.atan2(Math.sin(d), Math.cos(d));
  inp.steer = Math.max(-1, Math.min(1, d * 3.2));

  let vT = 1e9;
  const horizon = 200 + sp * 1.0, perIdx = 1 / T.spacing;
  for (let dist = 0; dist < horizon; dist += 30) {
    const kap = Math.abs(T.K[(e.hint + Math.round(dist * perIdx)) % T.N]);
    if (kap > 1e-5) {
      const vc = cornerSpeed(1 / kap, e.car) * (e.ref ? 1.0 : 0.97);
      const va = Math.sqrt(vc * vc + 2 * 700 * dist);
      if (va < vT) vT = va;
    }
  }
  const air = e.z > 0.01;
  inp.acc = sp < vT;
  inp.brk = sp > vT * 1.1 + 25;
  inp.drift = Math.abs(d) > 0.42 && sp > 480 && !e.onIce;
  inp.boost = e.ref && !air && Math.abs(d) < 0.07 && vT > sp + 260 && e.energy > 0.2;
}

// Rijdt een volledige run met de computerbestuurder; levert de referentietijd voor de medailles.
function simulateReference(tr, car) {
  const keep = T; T = tr;
  const e = newEntity(car, { ai: true, ref: true });
  placeOnGrid(e, 90, 0);
  let ticks = 0;
  const max = 300 / DT;
  while (e.progress < LAPS * tr.len && ticks < max) { aiControl(e); stepEntity(e); ticks++; }
  T = keep;
  return { time: ticks * DT, done: e.progress >= LAPS * tr.len, hits: e.hits };
}

// Medailletijden [brons, zilver, goud] voor een baan met een bepaald voertuig. De computer rijdt de baan
// één keer met dat voertuig; de uitkomst wordt onthouden. Zo is goud met elk voertuig even moeilijk.
function getMedals(tr, car) {
  if (!tr.medalCache) tr.medalCache = {};
  if (!tr.medalCache[car]) {
    const r = simulateReference(tr, CARS[car]);
    const base = r.done ? r.time : tr.len * LAPS / 850;
    tr.medalCache[car] = [base * 1.1, base * 1.0, base * 0.94];
  }
  return tr.medalCache[car];
}

// Zonder tijd: de medaille van het opgeslagen record, beoordeeld met het voertuig waarmee het gereden is.
function medalFor(tr, time, car) {
  if (time == null) { const r = save.tt[tr.id]; if (!r) return 0; time = r.total; car = r.car || 0; }
  const m = getMedals(tr, car);
  return time <= m[2] ? 3 : time <= m[1] ? 2 : time <= m[0] ? 1 : 0;
}

float hash(float n){ return fract(sin(n*127.1)*43758.5453); }
float hash2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);

}
float pn(float x, float per){
  float i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
  return mix(hash(mod(i, per)), hash(mod(i+1.0, per)), f);
}
float bayer(vec2 p){
  const float m[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);

float peak(float n){ return 1.0 - abs(2.0*n - 1.0); }

float ridge(float a01, float f1, float f2, float f3, float sd){
  return 0.55*peak(pn(a01*f1 + sd, f1)) + 0.3*pn(a01*f2 + sd, f2) + 0.15*pn(a01*f3 + sd, f3);

  float h = hash2(floor(vec2(a01*760.0, y*95.0)));

}

int castlePart(float dx, float y, float hw, float top, float cone){
  if (abs(dx) < hw && y < top + ((cone == 0.0 && fract(dx*38.0) < 0.5) ? 0.012 : 0.0)) return 1;
  if (cone > 0.0 && y >= top && y < top + cone*(1.0 - abs(dx)/(hw*1.35))) return 2;
  return 0;
}

      if (abs(dr) < w && dth > t*t) c = dr < -w*0.2 ? vec3(1.0, 1.0, 0.92) : (t < 0.5 ? vec3(0.55, 0.9, 1.0) : vec3(0.5, 0.55, 1.0));
    }
    // brokstukken: heldere stukjes die naar buiten vliegen, elk met een lichtspoor erachter
    vec2 dg = vec2(an/TAU*26.0, sd*4.5 - uTime*0.4);
    vec2 dc = floor(dg), df = fract(dg);
    float dh = hash2(dc);
    if (sd > 0.24 && dh > 0.72) {
      float ax = abs(df.x - 0.3 - 0.4*fract(dh*37.0))*sd*TAU/26.0;
      if (df.y > 0.74 && df.y < 0.92 && ax < 0.016) c = ax < 0.009 ? vec3(1.0) : vec3(1.0, 0.9, 0.5);
      else if (df.y > 0.05 && df.y <= 0.74 && ax < 0.014*df.y && dth < df.y*1.5) c = df.y > 0.5 ? vec3(1.0, 0.75, 0.3) : vec3(0.98, 0.42, 0.3);
    }
    if (y < 0.02 + (dth - 0.5)*0.03) c = vec3(1.0, 0.8, 0.5);
  }
  return c;
}

// Decor in lagen, van ver naar dichtbij. Elke laag heeft een lichte en donkere tint;
// "dth" is het rasterpatroon waarmee overgangen tussen tinten worden gemaakt.
vec3 sky(vec2 p){
  float dth = bayer(gl_FragCoord.xy);
  float y = p.y - uHz;
  float a = uYaw + atan(p.x, uF);
  if (uSkyOn > 0.5) {
    // geschilderd panorama: zes keer rond de horizon, om en om gespiegeld zodat de naden sluiten
    gSkyTex = true;
    float sv = y / 0.68;
    if (sv > 0.97 + dth * 0.09) return uSkyTop;
    return texture(uSky, vec2(a / TAU * 6.0, 1.0 - clamp(sv, 0.004, 1.0))).rgb;
  }
  float a01 = fract(a / TAU);
  float yb = floor((y + (dth - 0.5)*0.05) * 16.0) / 16.0;
  vec3 c = mix(uPal[0], uPal[1], smoothstep(0.0, 0.22, yb));
  c = mix(c, uPal[2], smoothstep(0.12, 0.6, yb));
  c = mix(c, uPal[3], smoothstep(0.5, 1.2, yb));
  if (uLook != 3 && uLook != 6 && uLook != 9) return skyAlt(c, y, a, a01, dth);
  float bx, cell, fx, da, sd;
  vec2 sp;

  if (uKind == 0) {
    // (de drie Coast-banen hebben elk een eigen decor in skyAlt)
  } else if (uKind == 1) {
    // ---------------- SAKURA: ochtendzon, besneeuwde berg, heuvels in de nevel, pagodes, torii, kersenbomen, dwarrelende bloesem
    da = atan(sin(a - 1.4), cos(a - 1.4));
    sp = vec2(da*uF, y - 0.3); sd = length(sp);
    if (sd < 0.145) c = sd < 0.128 ? vec3(1.0, 0.36, 0.3) : vec3(1.0, 0.62, 0.52);
    for (int r = 0; r < 3; r++) {
      float fr = float(r), yc = 0.52 - fr*0.13;
      float cw = (pn(a01*10.0 + fr*4.0, 10.0) - 0.5) * 0.055;
      if (cw > 0.0) {
        float dy = y - yc, edge = cw * (0.65 + 0.35*pn(a01*70.0 + fr*3.0, 70.0));
        if (abs(dy) < edge) c = dy > (dth - 0.5)*edge ? vec3(1.0, 0.97, 0.95) : vec3(1.0, 0.82, 0.85);
      }
    }
    // de grote berg met sneeuwkap
    float dm = atan(sin(a - 2.6), cos(a - 2.6));
    float mh = min(0.36 - abs(dm)*0.58, 0.3 + 0.004*sin(dm*60.0));
    if (y < mh) {
      bool lit = dm < 0.02*sin(y*30.0);
      c = lit ? vec3(0.58, 0.58, 0.82) : vec3(0.4, 0.4, 0.68);
      float snow = 0.2 + 0.03*sin(dm*38.0) + 0.018*sin(dm*90.0) + (dth - 0.5)*0.02;
      if (y > snow) c = lit ? vec3(1.0) : vec3(0.82, 0.86, 0.96);
      if (y < 0.1 + (dth - 0.5)*0.12) c = vec3(0.9, 0.78, 0.86);
    }
    // verre heuvels, nevel aan de voet
    float n1 = 0.6*pn(a01*8.0 + 3.0, 8.0) + 0.3*pn(a01*23.0, 23.0) + 0.1*pn(a01*70.0, 70.0), h1 = 0.04 + 0.13*n1;
    if (y < h1) {
      float t = y / h1;
      c = t > 0.55 + (dth - 0.5)*0.3 ? vec3(0.46, 0.64, 0.62) : vec3(0.36, 0.52, 0.56);
      if (t < 0.32 + (dth - 0.5)*0.3) c = vec3(0.86, 0.8, 0.86);
    }
    // pagodes en torii-poorten
    bx = a01*26.0; cell = floor(bx); fx = fract(bx);
    float px = (fx - 0.5) * 0.266;
    if (hash(cell + 3.0) > 0.45) {
      float tiers = 3.0 + floor(hash(cell + 9.0)*3.0), tH = 0.044, base = 0.022;
      float yy = y - base;
      if (y < base && abs(px) < 0.04) c = px < 0.0 ? vec3(0.56, 0.5, 0.54) : vec3(0.4, 0.34, 0.4);
      if (yy >= 0.0 && yy < tiers*tH) {
        float ti = floor(yy/tH), fy = fract(yy/tH), wB = 0.03 - ti*0.004;
        if (fy < 0.55) {
          if (abs(px) < wB) c = (abs(px) < wB*0.3 && fy > 0.12 && fy < 0.42) ? vec3(0.2, 0.1, 0.12) : (px < 0.0 ? vec3(0.8, 0.25, 0.2) : vec3(0.52, 0.13, 0.15));
        } else {
          float rw = wB + 0.028*(1.0 - (fy - 0.55)/0.45) + (fy < 0.63 ? 0.007 : 0.0);
          if (abs(px) < rw) c = px < -rw*0.2 ? vec3(0.36, 0.42, 0.48) : vec3(0.2, 0.24, 0.3);
        }
      }
      float top = base + tiers*tH;
      if (y >= top && y < top + 0.04 && abs(px) < 0.0035) c = vec3(0.96, 0.82, 0.4);
    } else if (hash(cell + 5.0) > 0.5) {
      bool post = abs(abs(px) - 0.022) < 0.0045 && y < 0.07;
      bool beam1 = y > 0.07 - 0.2*abs(px)*abs(px) + 0.0 && y < 0.082 + 6.0*px*px && abs(px) < 0.04;
      bool beam2 = y > 0.05 && y < 0.058 && abs(px) < 0.03;
      if (post || beam1 || beam2) c = (px < 0.0 && !beam1) || (beam1 && y > 0.076) ? vec3(0.86, 0.26, 0.2) : vec3(0.6, 0.14, 0.16);
    }
    // groene heuvelrand vooraan
    float h2 = 0.012 + 0.05*(0.6*pn(a01*14.0 + 1.0, 14.0) + 0.4*pn(a01*41.0, 41.0));
    if (y < h2) c = y > h2 - 0.011 + (dth - 0.5)*0.01 ? vec3(0.4, 0.66, 0.38) : vec3(0.2, 0.42, 0.26);
    // kersenbomen in bloei
    bx = a01*60.0; cell = floor(bx); fx = fract(bx);
    if (hash(cell + 21.0) > 0.35) {
      float ht = 0.03 + 0.03*hash(cell + 4.0), dx = (fx - 0.5)*0.115;
      if (y < ht && abs(dx + 0.006*sin(y*90.0 + cell)) < 0.0045) c = dx < 0.0 ? vec3(0.42, 0.26, 0.26) : vec3(0.26, 0.15, 0.18);
      vec2 q2 = vec2(dx, y - ht - 0.012);
      float cr = 0.026 + 0.014*hash(cell + 6.0);
      float rr = length(q2*vec2(1.0, 1.25)) / (1.0 + 0.2*sin(atan(q2.y, q2.x)*5.0 + cell));
      if (rr < cr) {
        float li = q2.y - q2.x, j = (dth - 0.5)*cr*0.6;
        c = li > cr*0.5 + j ? vec3(1.0, 0.88, 0.92) : (li > -cr*0.45 + j ? vec3(0.98, 0.64, 0.76) : vec3(0.8, 0.42, 0.6));
      }
    }
    // dwarrelende bloesemblaadjes
    vec2 pg = vec2(a01*240.0 - uTime*0.4 + y*30.0, y*46.0 + uTime*1.1);
    if (hash2(floor(pg)) > 0.972 && fract(pg.x) < 0.3 && fract(pg.y) < 0.5 && y > 0.02) c = vec3(1.0, 0.8, 0.88);

  } else if (uKind == 2) {
    // ---------------- KASTEEL: onweerslucht met bliksem, bloedmaan, bergen, het kasteel op een rots, kantelen met fakkels, vleermuizen
    float tick7 = floor(uTime*7.0);
    bool flash = fract(sin(tick7*12.9898)*43758.5453) > 0.975;
    if (flash) c = mix(c, vec3(0.62, 0.52, 0.82), 0.3);
    da = atan(sin(a - 0.6), cos(a - 0.6));
    sp = vec2(da*uF, y - 0.52); sd = length(sp);
    if (sd < 0.11) {
      float lit = (-sp.x + sp.y) / 0.11;
      c = lit > -0.2 + (dth - 0.5)*0.3 ? vec3(1.0, 0.32, 0.2) : vec3(0.6, 0.12, 0.14);
      if (hash2(floor(sp*60.0)) > 0.9) c *= 0.8;
    }
    for (int r = 0; r < 3; r++) {
      float fr = float(r), yc = 0.32 + fr*0.16;
      float nz = pn(a01*12.0 + fr*5.0 + uTime*0.012*(fr + 1.0), 12.0)*0.6 + pn(a01*40.0 + fr*9.0, 40.0)*0.4;
      float cw = (nz - 0.4)*0.26;
      if (cw > 0.0 && abs(y - yc) < cw) {
        float t = (y - yc)/cw, j = (dth - 0.5)*0.45;
        c = t < -0.3 + j ? vec3(0.62, 0.16, 0.16) : (t < 0.4 + j ? vec3(0.26, 0.08, 0.15) : vec3(0.1, 0.04, 0.1));
        if (flash) c = mix(c, vec3(0.85, 0.8, 1.0), 0.45);
      }
    }
    if (flash) {
      float bz = fract(sin(tick7*78.233)*43758.5453)*TAU;
      float dl = atan(sin(a - bz), cos(a - bz));
      if (abs(dl - 0.03*sin(y*40.0 + tick7) - 0.015*sin(y*95.0)) < 0.005 && y > 0.2) c = vec3(1.0, 0.97, 1.0);
    }
    // verre bergen, onderaan belicht door de lava
    float n1 = ridge(a01, 9.0, 29.0, 91.0, 6.0), h1 = 0.05 + 0.17*n1;
    if (y < h1) {
      float as = a01 + (h1 - y)*0.08;
      bool lit = ridge(as + 0.0012, 9.0, 29.0, 91.0, 6.0) > ridge(as, 9.0, 29.0, 91.0, 6.0);
      c = lit ? vec3(0.25, 0.1, 0.2) : vec3(0.14, 0.06, 0.13);
      if (y/h1 < 0.28 + (dth - 0.5)*0.3) c = vec3(0.55, 0.15, 0.1);
    }
    // de rots met het kasteel
    float X = atan(sin(a - 3.6), cos(a - 3.6)) * uF;
    float hc = 0.17 - abs(X)*0.45 + 0.02*pn(a01*120.0, 120.0);
    if (y < hc) c = X < 0.02*sin(y*60.0) ? vec3(0.17, 0.09, 0.13) : vec3(0.08, 0.04, 0.07);
    int part = 0, q = 0;
    float pdx = 0.0;
    if (y > 0.05 && abs(X) < 0.26) {
      q = castlePart(X, y, 0.21, 0.2, 0.0);          if (q > 0) { part = q; pdx = X + 0.05; }
      q = castlePart(X, y, 0.075, 0.33, 0.0);        if (q > 0) { part = q; pdx = X; }
      q = castlePart(X + 0.19, y, 0.022, 0.27, 0.06); if (q > 0) { part = q; pdx = X + 0.19; }
      q = castlePart(X - 0.19, y, 0.022, 0.27, 0.06); if (q > 0) { part = q; pdx = X - 0.19; }
      q = castlePart(X + 0.11, y, 0.03, 0.4, 0.08);   if (q > 0) { part = q; pdx = X + 0.11; }
      q = castlePart(X - 0.11, y, 0.03, 0.4, 0.08);   if (q > 0) { part = q; pdx = X - 0.11; }
      q = castlePart(X, y, 0.024, 0.47, 0.1);         if (q > 0) { part = q; pdx = X; }
    }
    if (part == 1) {
      c = pdx < 0.0 ? vec3(0.24, 0.15, 0.23) : vec3(0.12, 0.07, 0.13);
      vec2 wg = vec2(X*130.0, y*120.0);
      float wh = hash2(floor(wg));
      if (wh > 0.84 && fract(wg.x) > 0.35 && fract(wg.y) > 0.3 && y > 0.1) c = fract(uTime*0.4 + wh*7.0) < 0.92 ? vec3(1.0, 0.62, 0.15) : vec3(0.5, 0.2, 0.05);
      if (abs(X) < 0.02 && y < 0.11 + 0.02*(1.0 - abs(X)/0.02)) c = vec3(0.04, 0.02, 0.04);   // poort
    } else if (part == 2) c = pdx < 0.0 ? vec3(0.52, 0.1, 0.13) : vec3(0.27, 0.04, 0.09);
    // vleermuizen
    vec2 bg = vec2(a01*64.0 + uTime*0.35, y*8.0 + 0.3*sin(uTime*1.3 + a01*40.0));
    if (y > 0.2 && y < 0.62 && hash2(floor(bg)) > 0.9) {
      vec2 f = fract(bg) - 0.5;
      float flap = 0.5 + 0.45*sin(uTime*14.0 + hash2(floor(bg))*20.0);
      if (abs(f.x) < 0.2 && abs(f.y - abs(f.x)*flap) < 0.07) c = vec3(0.05, 0.02, 0.06);
    }
    // kasteelmuur vooraan: kantelen, wachttorens en fakkels
    bx = a01*90.0; cell = floor(bx); fx = fract(bx);
    float slot = mod(cell, 6.0);
    float wallH = slot < 1.0 ? 0.064 + (fract(bx*4.0) < 0.5 ? 0.009 : 0.0) : 0.03 + (fract(bx*3.0) < 0.5 ? 0.008 : 0.0);
    if (y < wallH) {
      c = fx < 0.5 ? vec3(0.17, 0.11, 0.16) : vec3(0.09, 0.05, 0.1);
      if (fract(y*130.0) < 0.2) c *= 0.72;
      if (slot < 1.0 && abs(fx - 0.5) < 0.14 && y > 0.036 && y < 0.05) c = vec3(1.0, 0.6, 0.15);
      if (slot >= 3.0 && slot < 4.0 && abs(fx - 0.5) < 0.13 && y > 0.012 && y < 0.026) c = dth > 0.4 ? vec3(1.0, 0.72, 0.2) : vec3(1.0, 0.4, 0.05);
    }
    if (y < 0.006) c = dth > 0.5 ? vec3(1.0, 0.7, 0.15) : vec3(1.0, 0.35, 0.05);

  } else {
    // ---------------- STERREN: nevels, planeet met ringen, maantje, asteroïden
    float nb = pow(pn(a01*12.0 + y*2.0, 12.0), 2.0)*smoothstep(0.02, 0.3, y) + 0.2*pn(a01*40.0 + y*5.0, 40.0);
    float l = nb + (dth - 0.5)*0.18;
    if (l > 0.66) c = vec3(0.75, 0.4, 0.95); else if (l > 0.5) c = vec3(0.4, 0.16, 0.62); else if (l > 0.38) c = vec3(0.16, 0.07, 0.34);
    l = pow(pn(a01*18.0 - y*3.0 + 5.0, 18.0), 3.0)*smoothstep(0.0, 0.3, y) + (dth - 0.5)*0.15;
    if (l > 0.5) c = vec3(0.25, 0.85, 0.8); else if (l > 0.33) c = vec3(0.08, 0.35, 0.45);
    c = starField(c, a01, y, 0.985);
    da = atan(sin(a - 1.0), cos(a - 1.0));
    sp = vec2(da*uF, y - 0.46); sd = length(sp);
    float R = 0.19;
    float ry = -sp.x*0.34 + sp.y*0.94;
    float rl = length(vec2(sp.x*0.94 + sp.y*0.34, ry*3.6));
    bool ring = rl > 0.25 && rl < 0.36 && fract(rl*55.0) > 0.25;
    if (sd < R) {
      float bi = fract((sp.y*30.0 + sin(sp.x*14.0)*0.6)*0.25);
      vec3 pc = bi < 0.3 ? vec3(0.95, 0.7, 0.45) : (bi < 0.55 ? vec3(0.8, 0.5, 0.4) : (bi < 0.8 ? vec3(0.9, 0.62, 0.5) : vec3(0.62, 0.38, 0.5)));
      float lit = (-sp.x*0.8 + sp.y*0.4) / R, j = (dth - 0.5)*0.35;
      if (lit < -0.25 + j) pc = vec3(0.16, 0.08, 0.26); else if (lit < 0.1 + j) pc *= 0.7;
      c = pc;
    }
    if (ring && !(sd < R && ry > 0.0)) c = rl > 0.31 ? vec3(0.88, 0.72, 0.56) : vec3(0.62, 0.46, 0.56);
    da = atan(sin(a - 4.3), cos(a - 4.3));
    sp = vec2(da*uF, y - 0.3);
    if (length(sp) < 0.04) c = (-sp.x + sp.y) > (dth - 0.5)*0.03 ? vec3(0.8, 0.86, 0.95) : vec3(0.3, 0.33, 0.5);
    // asteroïden met een lichte bovenkant
    vec2 ag = vec2(a01*70.0, y*9.0), ai = floor(ag);
    float ah = hash2(ai + 3.0);
    if (ah > 0.7 && y < 0.5) {
      vec2 dd = (fract(ag) - vec2(0.3 + 0.4*hash2(ai + 1.0), 0.3 + 0.4*hash2(ai + 2.0))) * vec2(0.099, 0.111);
      float ar = 0.008 + 0.022*hash2(ai + 5.0);
      float rr = length(dd) / (1.0 + 0.25*sin(atan(dd.y, dd.x)*3.0 + ah*20.0));
      if (rr < ar) {
        float li = (dd.y - dd.x)*0.7;
        c = li > ar*0.15 ? vec3(0.62, 0.55, 0.75) : (li > -ar*0.45 + (dth - 0.5)*ar*0.5 ? vec3(0.36, 0.3, 0.52) : vec3(0.16, 0.12, 0.3));
      }
    }
    if (y < 0.03 + (dth - 0.5)*0.04) c = uPal[0]*0.8;
    if (y < 0.008) c = min(uPal[0]*1.5, vec3(1.0));
  }
  return c;
}

void main(){
  vec2 n = (gl_FragCoord.xy - 0.5*uRes) / (0.5*uRes.y);
  float cr = cos(uRoll), sr = sin(uRoll);
  vec2 p = vec2(cr*n.x - sr*n.y, sr*n.x + cr*n.y);
  vec3 col;
  float skyPx = 0.0;
  if (p.y >= uHz - 0.0015) {
    col = sky(p);
    skyPx = 1.0;
  } else {
    float z = uCam.z * uF / (uHz - p.y);
    float x = p.x * z / uF;
    vec2 fw = vec2(cos(uYaw), sin(uYaw));
    vec2 rt = vec2(-fw.y, fw.x);
    vec2 w = uCam.xy + fw*z + rt*x;
    vec2 uv = w / uWorld;
    vec4 t = texture(uMap, uv);
    vec4 hz = texture(uHaz, uv);
    float sd = t.r, d = abs(sd);
    float ph = atan(t.b, t.g) / TAU;
    float fwD = fwidth(d) + 0.001;
    float aaD = 0.01;
    float pix = z*z / (uCam.z*uF) * 2.0 / uRes.y;
    float aaP = pix / uPeriod;
    float detail = clamp(1.0 - pix/40.0, 0.0, 1.0);

    // terrein buiten de baan
    vec3 ground = uPal[4];
    float outD = d - uHalfW - uWall;      // afstand buiten de vangrail
    if (uKind == 0) {
      // TROPISCH STRAND: lichte vlonder, geel zand, turquoise zee met witte branding
      if (outD < 70.0) {
        float pl = stripe(ph*6.0, aaP*6.0);
        ground = pl > 0.75 ? vec3(0.82, 0.64, 0.42) : (pl < 0.25 ? vec3(0.68, 0.5, 0.32) : vec3(0.75, 0.57, 0.37));
      } else if (outD < 170.0 + 70.0*vnoise(w/90.0)) {
        ground = vnoise(w/40.0) > 0.55 ? vec3(1.0, 0.9, 0.6) : vec3(0.94, 0.8, 0.5);
      } else {
        float wv = sin(w.y/26.0 + sin(w.x/70.0)*2.0 + uTime*1.4);
        ground = vnoise(w/700.0) > 0.5 ? vec3(0.1, 0.72, 0.8) : vec3(0.06, 0.58, 0.78);
        if (outD < 260.0 + 70.0*vnoise(w/90.0)) ground = vec3(0.4, 0.9, 0.85);
        if (wv > 0.86 && pix < 6.0) ground = vec3(1.0);
        if (outD < 192.0 + 70.0*vnoise(w/90.0) + 8.0*sin(uTime*1.3 + w.x/40.0)) ground = vec3(1.0);
      }
    } else if (uKind == 1) {
      float gn = vnoise(w/130.0) + 0.35*vnoise(w/37.0);
      ground = gn > 0.82 ? uPal[4]*1.22 : (gn > 0.5 ? uPal[4] : uPal[4]*0.8);
      if (pix < 3.0 && hash2(floor(w/7.0)) > 0.984) ground = uPal[13];
    } else if (uKind == 2) {
      // VUUR: donkere rotsplaat langs de baan, daarachter een lavaveld met drijvende korsten
      float nz = vnoise(w/260.0) + 0.5*vnoise(w/90.0);
      if (outD < 120.0 + 70.0*vnoise(w/120.0)) {
        float row = floor(outD/20.0), bv = ph*10.0 + row*0.5;
        bool mortar = fract(outD/20.0) < 0.12 || fract(bv) < 0.06;
        ground = mortar ? vec3(0.07, 0.04, 0.07) : (hash2(vec2(row, floor(bv))) > 0.5 ? vec3(0.21, 0.16, 0.21) : vec3(0.15, 0.11, 0.16));

    if (e.ai || (e === P && e.finished)) {

      else {
        if (e.ai && !e.finished && G.mode !== 'online') {
          const gap = e.progress - P.progress;
          e.skill = e.baseSkill * (gap > 1600 ? CLASSES[ui.cls].lead : gap < -1600 ? CLASSES[ui.cls].chase : 1);
        }

      }
    } else {
      const ctl = racing && !G.paused;   // online loopt de race door tijdens de pauze, zonder besturing
      inp.acc = ctl && !!(keys.ArrowUp || keys.KeyW);
      inp.brk = ctl && !!(keys.ArrowDown || keys.KeyS);
      inp.drift = ctl && !!(keys.ShiftLeft || keys.ShiftRight);
      inp.steer = ctl ? ((keys.ArrowRight || keys.KeyD) ? 1 : 0) - ((keys.ArrowLeft || keys.KeyA) ? 1 : 0) : 0;

        spawn(e.x, e.y, 6 + e.z, e.vx * 0.5 + (Math.random() - 0.5) * 320, e.vy * 0.5 + (Math.random() - 0.5) * 320, 60 + Math.random() * 160, 0.3 + Math.random() * 0.35, 2.2, '255,200,90', true, 520);

      spawn(e.x - fx * 24, e.y - fy * 24, 6 + e.z, e.vx * 0.6 + (Math.random() - 0.5) * 90, e.vy * 0.6 + (Math.random() - 0.5) * 90, (Math.random() - 0.3) * 60, 0.3, 2.6, '120,235,255', true, 0);
    if (G.ticks % 2 === 0) {
      e.trail.push(e.x - fx * 20 * e.car.l, e.y - fy * 20 * e.car.l, 7 + e.z);
      if (e.trail.length > 42) e.trail.splice(0, 3);
    }
    // vastgelopen computerrijder terugzetten
    if (e.ai && !e.isPlayer && racing && G.raceTicks > 480) {
      const ahead = e.progress > P.progress;
      if (e.wasAhead != null && ahead !== e.wasAhead) say(e.rival, ahead ? 'pass' : 'passed');
      e.wasAhead = ahead;
    }
    if (e.ai && live) {
      e.stuck = sp < 70 ? e.stuck + DT : 0;
      if (e.stuck > 2.2) {
        const p = posAt(e.s);
        e.x = p.x; e.y = p.y; e.th = Math.atan2(p.ty, p.tx); e.vx = p.tx * 320; e.vy = p.ty * 320; e.stuck = 0;
      }
    }
    // rondes
    if (live && !e.finished && !e.remote && e.progress >= (e.lap + 1) * T.len) {
      e.lap++;
      if (e === P) playerLap(now);
      if (e.lap >= LAPS) {
        e.finished = true; e.finishTime = now; e.arrive = G.time;
        if (G.mode === 'online' && e.bot != null) {
          NET.send({ t: 'botfin', bot: e.bot, time: now });
          if (G.ents.every(o => o.bot == null || o.remote || o.finished)) NET.send({ t: 'botsdone' });
        }
        if (e === P) finishRun(now);
        else if (G.state === 'finished') beep(990, 0.12, 'triangle', 0.07);
        else if (!G.ents.some(o => o !== e && o.finished)) say(e.rival, 'win', true);

  // Iedereen telt mee af (voor in beeld); alleen het spel dat die rijder rijdt (of de host bij een computerrijder) beslist.
  if (G.mode === 'online' && live && G.ents.length > 1) {
    const left = G.ents.filter(o => !o.finished);
    if (left.length === 1) {
      if (G.lastT == null) { G.lastT = LAST_GRACE; if (left[0] === P) showMsg('LAST ONE LEFT', 'finish within ' + LAST_GRACE + ' seconds!', '#ffb833', 2.5); }
      G.lastT -= DT;
      const e = left[0];
      if (G.lastT <= 0 && !e.remote) {
        e.finished = true; e.dnf = true; e.finishTime = 1e9; e.arrive = G.time;
        if (e.bot != null) { NET.send({ t: 'botfin', bot: e.bot, time: -1 }); NET.send({ t: 'botsdone' }); }

    G.ticks++;

      G.ghostRec.push(Math.round(P.x * 10) / 10, Math.round(P.y * 10) / 10, Math.round(P.th * 1000) / 1000, Math.round(P.z));
  }
}

function playerLap(now) {
  const lap = now - G.lapStart;
  G.lapStart = now;
  G.laps.push(lap);
  if (G.laps.length >= LAPS) return;
  const rec = record(), prevBest = rec ? rec.bestLap : null;
  let sub = '', color = '#fff';
  if (G.mode === 'tt' && prevBest != null) {
    sub = (lap - prevBest >= 0 ? '+' : '') + (lap - prevBest).toFixed(3) + ' vs best lap';
    if (lap < prevBest) color = '#7dffb0';
  }
  showMsg('LAP ' + G.laps.length + '  ' + fmt(lap), sub, color, 2.4);
  beep(880, 0.15, 'square', 0.08);
  if (G.laps.length === LAPS - 1) {
    G.msgQueue = { t: 2.5, text: 'FINAL LAP' }; MUSIC.fast = true;
    if (G.mode === 'cup') {
      const P = G.player, rivals = G.ents.filter(e => e.ai && !e.finished).sort((a, b) => Math.abs(a.progress - P.progress) - Math.abs(b.progress - P.progress));
      const id = G.raceId;
      if (rivals.length) setTimeout(() => { if (G.state === 'race' && G.raceId === id) say(rivals[0].rival, 'final', true); }, 4600);
    }
  }
}

function finishRun(total) {
  G.state = 'finished'; G.finishT = 0; G.state2 = '';
  const bestLap = Math.min(...G.laps);
  if (G.mode === 'tt') {
    const rec = record();
    G.newRecord = !rec || total < rec.total;
    G.medal = medalFor(T, total, ui.car);
    if (G.newRecord) save.tt[T.id] = { total, laps: G.laps.slice(), bestLap: Math.min(bestLap, rec ? rec.bestLap : Infinity), ghost: G.ghostRec.slice(), car: ui.car };
    else if (bestLap < rec.bestLap) rec.bestLap = bestLap;
    persist();
  } else {
    G.committed = false; G.radio = null;
    if (G.mode === 'online') NET.send({ t: 'fin', time: total });
  }
  beep(660, 0.18, 'square', 0.09);
  setTimeout(() => beep(880, 0.18, 'square', 0.09), 160);
  setTimeout(() => beep(1320, 0.5, 'square', 0.09), 320);
}

function finishCup() {
  const rows = [{ name: 'YOU', pal: RIVALS[ui.char].pal, player: true, total: cupRun.points[0] }]
    .concat(cupRun.rivals.map((ci, i) => ({ name: RIVALS[ci].name, pal: RIVALS[ci].pal, player: false, rival: ci, total: cupRun.points[i + 1] })));
  rows.sort((a, b) => b.total - a.total || (a.player ? -1 : 1));
  G.results = rows;
  const pos = rows.findIndex(r => r.player) + 1;
  G.cupPos = pos;
  if (!save.cups[cupKey(ui.cup)] || pos < save.cups[cupKey(ui.cup)]) { save.cups[cupKey(ui.cup)] = pos; persist(); }
  G.finishT = 0;
  MUSIC.intensity = 0;
}

function update(dt) {
  G.time += dt;
  if (G.state === 'menu') {
    G.menuS += 520 * dt;
    if (ui.screen === 'title') {
      ui.reelT = (ui.reelT || 0) + dt;
      const n = Math.floor(ui.reelT / REEL_SHOT);
      if (n !== ui.reelN) {
        ui.reelN = n;
        const k = Math.floor(n / REEL_PER);
        if (n % REEL_PER === 0) { ui.bgWant = reelTrack(k); requestTrack(ui.bgWant); }
        if (n % REEL_PER === REEL_PER - 1) prefetchTrack(reelTrack(k + 1));
      }
    }
    if (ui.bgT > 0) { ui.bgT -= dt; if (ui.bgT <= 0) requestTrack(ui.bgWant); }
    return;
  }
  if (G.paused && G.mode !== 'online') return;
  if (G.state === 'countdown' && G.mode === 'online' && NET.goAt) {
    // online telt iedereen af naar hetzelfde moment, los van laden, haperen of de intro overslaan;
    // wie de intro overslaat wacht achter de streep (READY?) tot de aftelling bij iedereen begint
    const rem = (NET.goAt - Date.now()) / 1000;
    if (G.intro > 0) G.intro = Math.min(G.intro, Math.max(0, rem - 3.2) + dt);
    G.countdown = Math.min(3.2, rem) + dt;   // hieronder gaat er nog dt af
  }
  if (G.state === 'countdown' && G.intro > 0) G.intro = Math.max(0, G.intro - dt);
  else if (G.state === 'countdown') {
    G.countdown -= dt;
    // raketstart: gas geven in de laatste halve seconde voor GO (en niet eerder) geeft een boost mee
    if (keys.ArrowUp || keys.KeyW) { if (G.accAt == null) G.accAt = G.countdown; } else G.accAt = null;
    const c = Math.ceil(G.countdown);
    if (c < G.lastBeep && c >= 1 && c <= 3) { beep(440, 0.18, 'square', 0.1); G.lastBeep = c; }
    if (G.countdown <= 0) {
      G.state = 'race'; beep(880, 0.5, 'square', 0.12);
      if (G.accAt != null && G.accAt < 0.5) {
        const P = G.player;
        P.padT = 1.3; P.vx += Math.cos(P.th) * 300; P.vy += Math.sin(P.th) * 300;
        showMsg('ROCKET START!', '', '#ffd24a', 1.2); beep(1320, 0.3, 'square', 0.1);
      } else showMsg('GO!', '', '#7dffb0', 1.0);
      const id = G.raceId;
      if (G.mode === 'cup') setTimeout(() => { if (G.state === 'race' && G.raceId === id) say(cupRun.rivals[Math.floor(Math.random() * 5)], 'start', true); }, 1200);
    }
  }
  if (G.state === 'finished') G.finishT += dt;
  if (G.msgT > 0) G.msgT -= dt;
  if (G.radio) { G.radio.t -= dt; G.radio.age += dt; if (G.radio.t <= 0) G.radio = null; }
  if (G.msgQueue) { G.msgQueue.t -= dt; if (G.msgQueue.t <= 0) { showMsg(G.msgQueue.text, '', '#ffcf5a', 1.6); G.msgQueue = null; } }
  G.shake = Math.max(0, G.shake - dt * 3.5);
  G.flash = Math.max(0, G.flash - dt * 1.8);
  updateParts(dt);
}

// Raster voor pixelart. Vormen worden in ontwerpeenheden opgegeven en op een ss keer zo fijn raster gezet,

function sprGrid(w, h, ss) {

  const each = fn => { for (let Y = 0; Y < H2; Y++) for (let X = 0; X < W2; X++) fn(X, Y, (X + 0.5) / ss - 0.5, (Y + 0.5) / ss - 0.5); };

    if (rw <= 0 || rh <= 0) return;
    const X0 = Math.round(x * ss), X1 = Math.max(X0 + 1, Math.round((x + rw) * ss));
    const Y0 = Math.round(y * ss), Y1 = Math.max(Y0 + 1, Math.round((y + rh) * ss));
    for (let Y = Y0; Y < Y1; Y++) for (let X = X0; X < X1; X++) {
      if (only && (X < 0 || X >= W2 || Y < 0 || Y >= H2 || g[Y * W2 + X] == null)) continue;
      setF(X, Y, m); if (sym) setF(W2 - 1 - X, Y, m);
    }
  };

    px: (x, y, m, sym) => rect(Math.round(x), Math.round(y), 1, 1, m, sym),
    // alleen kleuren waar al iets staat (voor strepen op een vorm)
    over: (x, y, rw, rh, m) => rect(x, y, rw, rh, m, false, true),
    line: (x0, y0, x1, y1, m) => { const st = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * ss) || 1; for (let i = 0; i <= st; i++) rect(x0 + (x1 - x0) * i / st, y0 + (y1 - y0) * i / st, 1, 1, m); },
    rect: (x, y, rw, rh, m, sym) => rect(x, y, rw, rh, m, sym),
    ell: (cx, cy, rx, ry, m, sym) => each((X, Y, x, y) => { if (((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1) { setF(X, Y, m); if (sym) setF(W2 - 1 - X, Y, m); } }),
    poly: (p, m, sym) => each((X, Y, x, y) => {
      let inside = false;
      for (let i = 0, cnt = p.length / 2; i < cnt; i++) {
        const j = (i + 1) % cnt, xa = p[i * 2], ya = p[i * 2 + 1], xb = p[j * 2], yb = p[j * 2 + 1];

      }
      if (inside) { setF(X, Y, m); if (sym) setF(W2 - 1 - X, Y, m); }
    })
  };
  return { d, g, W2, H2 };
}

function dressTrack(tr) {
  const out = [], gates = [], L = tr.len, base = tr.hw + WALL, N = tr.N;
  // vrij van andere stukken baan? (het eigen stuk telt niet mee)
  const clear = (x, y, own, need) => {
    const n2 = need * need;
    for (let i = 0; i < N; i += 3) {
      let di = Math.abs(i - own); di = Math.min(di, N - di);
      if (di < 90) continue;
      const dx = tr.SX[i] - x, dy = tr.SY[i] - y;
      if (dx * dx + dy * dy < n2) return false;
    }
    return true;
  };
  const put = (sv, k, side, off) => {
    const p = posAt(sv, tr), x = p.x - p.ty * off * side, y = p.y + p.tx * off * side;
    if (!clear(x, y, p.i, base + 30)) return false;
    out.push({ x, y, k });
    return true;
  };
  const sideOf = (sv, side) => {
    if (side === 'L') return -1;
    if (side === 'R') return 1;
    const inner = tr.K[posAt(sv, tr).i] >= 0 ? 1 : -1;
    return side === 'in' ? inner : -inner;
  };
  const addGate = (sv, style) => {
    const p = posAt(sv, tr), off = base + 16;
    const g = { style, x: p.x, y: p.y, lx: p.x + p.ty * off, ly: p.y - p.tx * off, rx: p.x - p.ty * off, ry: p.y + p.tx * off };
    if (clear(g.lx, g.ly, p.i, base + 12) && clear(g.rx, g.ry, p.i, base + 12)) gates.push(g);
  };
  for (const op of DRESS[tr.index]) {
    if (op[0] === 'gate') addGate(op[1] * L, op[2]);
    else if (op[0] === 'gates') { for (let sv = op[1] * L; sv < op[2] * L; sv += op[3]) addGate(sv, op[4]); }
    else if (op[0] === 'row') {
      for (let sv = op[1] * L; sv < op[2] * L; sv += op[4]) {
        if (op[5] === 'both') { put(sv, op[3], -1, base + op[6]); put(sv, op[3], 1, base + op[6]); }
        else put(sv, op[3], sideOf(sv, op[5]), base + op[6]);
      }
    } else if (op[0] === 'mark') {
      const sd = sideOf(op[1] * L, op[3]);
      if (!put(op[1] * L, op[2], sd, base + op[4])) put(op[1] * L, op[2], -sd, base + op[4]);
    } else if (op[0] === 'crowd') {
      let n = 0;
      for (let sv = op[1] * L; sv < op[2] * L; sv += op[4], n++) {
        const k = op[3][(n * 3 + (n >> 2)) % op[3].length], off = base + op[6] + (n * 7 % 3) * 12;
        if (op[5] === 'both') { put(sv, k, -1, off); put(sv + op[4] * 0.4, op[3][(n + 1) % op[3].length], 1, off); }
        else put(sv, k, sideOf(sv, op[5]), off);
      }
    }
  }
  // pijlborden aan de buitenkant van scherpe bochten
  for (let sv = 0; sv < L; sv += 130) {
    const k = tr.K[posAt(sv, tr).i];
    const cv = tr.index === 2 ? 8 : tr.cup;   // pijlbord in de stijl van de cup (de kermis heeft een eigen)
    if (Math.abs(k) > 1 / 620) put(sv, (k > 0 ? 'chevR' : 'chevL') + cv, k > 0 ? -1 : 1, base + 24);
  }
  tr.scenery = out; tr.gates = gates;
}

const ART_OBJ = {};
// Een plaatje met dezelfde naam plus "2" (bijvoorbeeld volley2) is het tweede beeldje van een bewegend object.
function artSprite(li, k) {
  const im = ART_OBJ[k], sp = SPRITES[li + ':' + k];
  if (!im || !sp) return;
  const fog = LOOKS[li].pal[0].map(v => Math.round(v * 0.75 * 255));
  const make = src => {
    const c = document.createElement('canvas');
    c.width = im.width; c.height = im.height;   // beide beeldjes op dezelfde maat, onderaan uitgelijnd
    c.getContext('2d').drawImage(src, Math.round((im.width - src.width) / 2), im.height - src.height);
    const hz = document.createElement('canvas');
    hz.width = c.width; hz.height = c.height;
    const hk = hz.getContext('2d');
    hk.drawImage(c, 0, 0);
    hk.globalCompositeOperation = 'source-atop';
    hk.fillStyle = 'rgba(' + fog.join(',') + ',0.6)';
    hk.fillRect(0, 0, hz.width, hz.height);
    return [c, hz];
  };
  const [c, hz] = make(im), im2 = ART_OBJ[k + '2'], [c2, hz2] = im2 ? make(im2) : [c, hz];
  sp.c = c; sp.haze = hz; sp.c2 = c2; sp.haze2 = hz2; sp.ws = SPR_DEF[k][2] / c.height;
}
for (const k in ART_DATA.obj) {

}

const LIGHTS = ['#ffe060', '#ff5a8a', '#4fe0ff', '#7dffb0'];
function drawGate(g, z) {
  const st = GATE[g.style];
  // een paal vlak naast of achter de camera geeft enorme vlakken dwars door het beeld: dan niet tekenen
  if (!project(g.lx, g.ly, 0) || pr[2] < 115) return;
  const xl = pr[0], ybl = pr[1], sl = cam.f / pr[2] * H / 2;
  if (!project(g.lx, g.ly, st.h)) return;
  const ytl = pr[1];
  if (!project(g.rx, g.ry, 0) || pr[2] < 115) return;
  const xr = pr[0], ybr = pr[1], sr = cam.f / pr[2] * H / 2;
  if (!project(g.rx, g.ry, st.h)) return;
  const ytr = pr[1];
  ctx.globalAlpha = z > 2600 ? 0.55 : 1;
  // punt op de lijn tussen de twee paaltoppen: [x, y, pixels per eenheid]
  const P = t => [xl + (xr - xl) * t, ytl + (ytr - ytl) * t, sl + (sr - sl) * t];
  const post = (x, yb, yt, sc) => {
    const w = Math.max(2, st.pw * sc);
    ctx.fillStyle = st.post; fillPoly([x - w / 2, yt, x, yt, x, yb, x - w / 2, yb]);
    ctx.fillStyle = st.postD; fillPoly([x, yt, x + w / 2, yt, x + w / 2, yb, x, yb]);
  };
  // balk tussen t0 en t1; up = bovenkant boven de paaltop, th = dikte (wereldeenheden)
  const beam = (t0, t1, up, th, col) => {
    const a = P(t0), b = P(t1);
    ctx.fillStyle = col;
    fillPoly([a[0], a[1] - up * a[2], b[0], b[1] - up * b[2], b[0], b[1] - (up - th) * b[2] + 1, a[0], a[1] - (up - th) * a[2] + 1]);
  };
  const dotAt = (t, drop, size, col) => {
    const p = P(t), sz = Math.max(1, Math.round(size * p[2]));
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(p[0] - sz / 2), Math.round(p[1] + drop * p[2] - sz / 2), sz, sz);
  };
  if (st.kind !== 'hoop') { post(xl, ybl, ytl, sl); post(xr, ybr, ytr, sr); }
  if (st.kind === 'checker') {
    beam(0, 1, 34, 4, '#ffb833');
    for (let i = 0; i < 14; i++) {
      beam(i / 14, (i + 1) / 14, 30, 15, i % 2 ? '#ffffff' : '#16101a');
      beam(i / 14, (i + 1) / 14, 15, 15, i % 2 ? '#16101a' : '#ffffff');
    }
    beam(0, 1, 0, 4, '#ffb833');
  } else if (st.kind === 'torii') {
    beam(-0.14, 1.14, 30, 9, '#2a1a20');
    beam(-0.12, 1.12, 21, 13, st.post);
    beam(-0.12, 1.12, 10, 3, st.postD);
    beam(-0.03, 1.03, -22, 10, st.post);
  } else if (st.kind === 'truss') {
    beam(-0.06, 1.18, 18, 7, st.post); beam(-0.06, 1.18, -14, 7, st.postD);
    for (let i = 0; i < 12; i++) beam(-0.06 + i * 1.24 / 12, -0.06 + i * 1.24 / 12 + 0.018, 11, 25, i % 2 ? st.post : st.postD);
    const p = P(0.62);
    ctx.fillStyle = '#16101a'; ctx.fillRect(Math.round(p[0]), Math.round(p[1] + 14 * p[2]), 1, Math.max(1, Math.round(60 * p[2])));
    dotAt(0.62, 80, 16, '#c8402c');
    if ((G.time * 1.4) % 1 < 0.5) dotAt(1.16, -22, 5, '#ff3040');
  } else if (st.kind === 'lights' || st.kind === 'bunting') {
    const cnt = 15, sh = Math.floor(G.time * 2);
    for (let i = 0; i < cnt; i++) {
      const t = (i + 0.5) / cnt, sag = 38 * Math.sin(Math.PI * t);
      dotAt(t, sag, 1.5, '#2a1a30');
      if (st.kind === 'lights') dotAt(t, sag + 4, 6, LIGHTS[(i + sh) % 4]);
      else {
        const p = P(t), sz = Math.max(2, 9 * p[2]), y0 = p[1] + sag * p[2];
        ctx.fillStyle = LIGHTS[i % 4];
        fillPoly([p[0] - sz / 2, y0, p[0] + sz / 2, y0, p[0], y0 + sz * 1.3]);

const WXR = (() => { const r = mulberry32(99), a = new Float32Array(600); for (let i = 0; i < a.length; i++) a[i] = r(); return a; })();
function drawWeather() {

function drawWeatherKind(kind) {

// Tekent objecten en voertuigen samen, van ver naar dichtbij.
const drawList = [];

const FLY = { fgull: { r: 420, w: 0.32, f: -1 }, fflamingo: { r: 380, w: 0.26, f: -1 }, fdragon: { r: 460, w: 0.36, f: 1 }, fbat: { r: 300, w: 0.55, f: 0 },

function render(dt) {

    for (let i = 0; i < cnt; i++) {
      const a = Math.random() * 6.2832, r0 = (0.35 + Math.random() * 0.5) * W * 0.6, len = Math.ceil((40 + Math.random() * 140) * u * sl);
      const dx = Math.cos(a), dy = Math.sin(a) * 0.7;

// Bovenaanzicht van een voertuig, opgebouwd uit dezelfde vlakken als het 3D-model.
function drawCarTop(cx, cy, scale, car, pal) {
  const M = MODELS[car.id], V = M.v;
  const order = M.f.map((f, i) => {
    let z = 0;
    for (const k of f[0]) z += V[k][2];
    return [i, z / f[0].length + (f[2] ? 1e5 : 0)];
  }).sort((a, b) => a[1] - b[1]);
  const p = [];
  for (const [fi] of order) {
    const f = M.f[fi];
    p.length = 0;
    for (const k of f[0]) p.push(cx + V[k][0] * scale, cy - V[k][1] * scale);
    ctx.fillStyle = pal[f[1]] || '#d8f2ff';
    fillPoly(p);
  }
}

// Alle cups in rijen van vier. De rij van de gekozen cup schuift in beeld; de rij erna is half te zien.
// mode: 0 tijdrit (medailles), 1 cup (beste plaats), 2 online (alleen de banen)
let cupScroll = 0;
function drawCupGrid(u, sel, mode) {
  const cols = 4, gap = 18 * u, cw = Math.min(250 * u, (W - 80 * u - gap * (cols - 1)) / cols), ch = 300 * u;
  const x0 = W / 2 - (cw * cols + gap * (cols - 1)) / 2, y0 = 150 * u, areaH = Math.min(H - y0 - 70 * u, ch * 1.5 + gap);
  const rows = Math.ceil(CUPS.length / cols), maxS = Math.max(0, rows * (ch + gap) - gap - areaH);
  const target = Math.max(0, Math.min(maxS, Math.floor(sel / cols) * (ch + gap)));
  cupScroll += (target - cupScroll) * 0.2;
  if (Math.abs(target - cupScroll) < 0.5) cupScroll = target;
  const sc = Math.round(cupScroll);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, Math.round(y0 - 8 * u), W, Math.round(areaH + 16 * u)); ctx.clip();
  CUPS.forEach((c, i) => {
    const x = x0 + (i % cols) * (cw + gap), y = Math.round(y0 + Math.floor(i / cols) * (ch + gap)) - sc;
    if (y > y0 + areaH + 8 * u || y + ch < y0 - 8 * u) return;
    const t2 = THEMES[c.theme], isSel = sel === i;
    card(x, y, cw, ch, isSel, t2.ui);
    ctx.fillStyle = t2.ui; ctx.fillRect(Math.round(x + 18 * u), Math.round(y + 18 * u), Math.round(cw - 36 * u), Math.round(6 * u));
    text(c.name, x + cw / 2, y + 58 * u, 24 * u, isSel ? t2.accent : '#fff', 'center', 900);
    for (let k = 0; k < 3; k++) {
      const tr = TRACKS[i * 3 + k], yy = y + (94 + 28 * k) * u;
      text(tr.name, x + 20 * u, yy, 13 * u, '#fff', 'left', 600, false);
      if (mode === 0) medalDot(x + cw - 28 * u, yy - 6 * u, 7 * u, medalFor(tr));
    }
    if (mode === 1) {
      const best = save.cups[cupKey(i)];
      text(best ? 'Best: ' + ord(best) + ' place' : 'Not raced yet', x + cw / 2, y + 184 * u, 15 * u, best && best <= 3 ? MEDAL_COL[4 - best] : '#cfd3ff', 'center', 700, false);
    }
    const words = c.sub.split(' '), half = Math.ceil(words.length / 2);
    text(words.slice(0, half).join(' '), x + cw / 2, y + 208 * u, 12 * u, '#cfd3ff', 'center', 500, false);
    text(words.slice(half).join(' '), x + cw / 2, y + 224 * u, 12 * u, '#cfd3ff', 'center', 500, false);
    const em = ART_OBJ['e' + i];
    if (em) { const es = Math.round(56 * u); ctx.drawImage(em, Math.round(x + cw / 2 - es / 2), Math.round(y + ch - es - 8 * u + (isSel ? Math.sin(G.time * 4) * 2 * u : 0)), es, es); }
  });
  ctx.restore();
  if (sc < maxS - 1) text('- MORE CUPS BELOW -', W / 2, y0 + areaH + 30 * u, 13 * u, '#cfd3ff', 'center', 700);
  if (sc > 1) text('- MORE CUPS ABOVE -', W / 2, y0 - 16 * u, 13 * u, '#cfd3ff', 'center', 700);
}
// Het logo op het startscherm is een plaatje: art/obj/logo.png (gemaakt met SpriteCook).
let logoBox = null;
function drawLogo(u) {
  const im = ART_OBJ.logo;
  if (!im) return;
  if (!logoBox) {
    // de lege rand om het logo heen niet meetellen
    const c = document.createElement('canvas'); c.width = im.width; c.height = im.height;
    const g = c.getContext('2d'); g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height).data;
    let x0 = c.width, y0 = c.height, x1 = 0, y1 = 0;
    for (let j = 0; j < c.height; j++) for (let i = 0; i < c.width; i++) if (d[(j * c.width + i) * 4 + 3] > 20) { x0 = Math.min(x0, i); y0 = Math.min(y0, j); x1 = Math.max(x1, i); y1 = Math.max(y1, j); }
    logoBox = { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
  }
  // snelheidsstrepen erachter
  for (let i = 0; i < 9; i++) {
    const len = Math.round((80 + (i * 53) % 140) * u), sp = 420 + (i * 97) % 300;
    const sx = Math.round(((i * 211 - G.time * sp) % (W + len) + W + len) % (W + len) - len);
    ctx.fillStyle = i % 3 === 0 ? 'rgba(255,79,138,0.85)' : 'rgba(207,211,255,0.6)';
    ctx.fillRect(sx, Math.round(H * 0.4 - (110 - i * 13) * u), len, Math.max(2, Math.round(5 * u)));
  }
  const b = logoBox, hh = Math.round(Math.min(270 * u, H * 0.4 + 60 * u)), ww = Math.round(b.w * hh / b.h);
  const bob = Math.round(Math.sin(G.time * 2) * 2 * u);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(im, b.x, b.y, b.w, b.h, Math.round(W / 2 - ww / 2), Math.round(H * 0.4 + 100 * u - hh) + bob, ww, hh);
}

// De andere spelers worden 100 ms achter de laatste berichten getekend, zodat er altijd twee standen zijn om tussen te

const NET = {

}
netRefreshAddr();
function netUrl() {

// Op de website wordt het adres vlak voor het verbinden opnieuw opgehaald: de server kan intussen opnieuw gestart zijn

  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch (e) { return; } netOnMessage(m); };

// keuzes van de host: meteen op het eigen scherm, en met een volgnummer naar de server
const NET_HOST_KEYS = ['step', 'omode', 'cup', 'tr', 'cls', 'bots', 'cupRace'];
function netSet(o) {

}
function netOnMessage(m) {

      if (NET.pending) { const p = NET.pending; NET.pending = null; p(); }
      break;
    case 'pong': {

      break;
    }
    case 'err': NET.err = m.msg; break;
    case 'room':
      if (!m.code) { NET.room = null; break; }
      {
        const prev = NET.room;
        if (!prev || prev.code !== m.code) NET.setSeq = 0;
        // de host kiest sneller dan de server antwoordt: een antwoord op een oudere keuze mag de nieuwere keuzes op het
        // scherm niet terugzetten (m.hs = de laatste keuze die de server verwerkt heeft)

          for (const k of NET_HOST_KEYS) m[k] = prev[k];
        NET.room = m; NET.err = '';
        ui.cls = m.cls;
        // een race is voor iedereen afgelopen: punten tellen (in een cup)
        if (prev && prev.code === m.code && prev.state === 'race' && m.state === 'lobby') netScoreRace();
        const bg = m.cup * 3 + (m.omode === 1 ? m.cupRace : m.tr);
        if (G.state === 'menu' && TRACKS[bg] && loadedTrack !== bg) { ui.bgWant = bg; requestTrack(bg); }
      }
      break;
    case 'start': netStartRace(m); break;
    case 's': {
      const now = performance.now();
      // hoe onregelmatig komen de berichten binnen? (het spel stuurt er elke 50 ms een)
      const prevAt = NET.buf[m.id] && NET.buf[m.id].length ? NET.buf[m.id][NET.buf[m.id].length - 1].at : 0;
      if (prevAt) { const gap = now - prevAt; NET.gapMax = Math.max(gap, (NET.gapMax || 50) * 0.98); }
      (NET.buf[m.id] || (NET.buf[m.id] = [])).push({ at: now, d: m });
      if (NET.buf[m.id].length > 30) NET.buf[m.id].splice(0, 10);
      if (m.bots) m.bots.forEach((b, i) => {
        (NET.botBuf[i] || (NET.botBuf[i] = [])).push({ at: now, d: { x: b[0], y: b[1], th: b[2], z: b[3], vx: b[4], vy: b[5], st: b[6], b: b[7], p: b[8], l: b[9] } });
        if (NET.botBuf[i].length > 30) NET.botBuf[i].splice(0, 10);
      });
      break;
    }
    case 'fin': {
      const e = G.ents.find(x => x.netId === m.id);
      if (e && !e.finished) { e.finished = true; e.finishTime = m.time > 0 ? m.time : 1e9; e.arrive = G.time; e.dnf = !(m.time > 0); }
      break;
    }
    case 'botfin': {
      const e = G.ents.find(x => x.remote && x.bot === m.bot);
      if (e && !e.finished) { e.finished = true; e.dnf = !(m.time > 0); e.finishTime = m.time > 0 ? m.time : 1e9; e.arrive = G.time; }
      break;
    }
    case 'left': {
      const i = G.ents.findIndex(x => x.netId === m.id);
      if (i >= 0 && G.state !== 'menu') { netFeed(G.ents[i].name + ' LEFT', '#ff8a8a'); G.ents.splice(i, 1); }
      delete NET.buf[m.id];
      // de host is weg: zijn computerrijders worden nergens meer gereden; ze blijven anders stilstaan en de race
      // (en de laatste-rijder-klok) loopt nooit af
      if (NET.race && NET.race.host === m.id && G.mode === 'online' && G.state !== 'menu')
        for (const e of G.ents) if (e.remote && e.bot != null && !e.finished) { e.finished = true; e.dnf = true; e.finishTime = 1e9; e.arrive = G.time; }
      break;
    }
    case 'end': if (G.mode === 'online' && G.state !== 'menu') toMenu('online'); break;
    case 'emote': {
      const p = NET.room && NET.room.players.find(x => x.id === m.id);
      if (p) netFeed(p.name + ': ' + EMOTES[m.e], RIVALS[p.char].pal[2]);
      break;
    }
  }
}
function netFeed(txt, col) { NET.feed.push({ txt, col, t: G.time }); if (NET.feed.length > 5) NET.feed.shift(); }
function netEmote(i) { if (NET.room) NET.send({ t: 'emote', e: i }); }
function netPick() { if (NET.id != null) NET.send({ t: 'pick', char: ui.char, car: ui.car, name: netName() }); }
const isHost = () => NET.room && NET.room.host === NET.id;
function netTyping() { return !NET.room && NET.row !== 2; }
let netNameTyped = (() => { try { return localStorage.getItem('kott-name') || ''; } catch (e) { return ''; } })();
const netName = () => netNameTyped.trim() || RIVALS[ui.char].name;
function netSaveName() { try { localStorage.setItem('kott-name', netNameTyped); } catch (e) {} netPick(); }

// Startvolgorde en deelnemers zijn bij iedereen gelijk: spelers in de volgorde van de server, daarna de computerrijders.
function netStartRace(m) {
  const me = NET.room && NET.room.players.find(p => p.id === NET.id);
  if (!me || !m.grid.includes(NET.id)) { NET.race = null; return; }
  NET.race = m; NET.buf = {}; NET.botBuf = [];
  if (m.omode === 1 && m.cupRace === 0) { NET.cup = { table: {}, race: -1 }; NET.cupDone = false; }
  ui.cls = m.cls;
  G.state2 = '';
  startRace(m.track, 'online');
  // gezamenlijk startmoment op de klok van de server: intro plus aftellen, bij iedereen tegelijk afgelopen
  NET.goAt = m.time ? m.time - NET.offset + (INTRO_T + 3.2) * 1000 : 0;
}
function netSetupRace(p) {
  const m = NET.race, players = NET.room.players, rng = mulberry32(m.seed);
  const place = (e, slot) => placeOnGrid(e, 90 + 75 * slot, slot % 2 ? 62 : -62);
  p.netId = NET.id; p.face = ui.char; G.lastT = null;
  m.grid.forEach((id, slot) => {
    if (id === NET.id) { place(p, slot); return; }
    const q = players.find(x => x.id === id);
    if (!q) return;
    const e = newEntity(CARS[q.car] || CARS[0], { remote: true, netId: id, name: q.name, pal: RIVALS[q.char].pal });
    e.face = q.char;
    place(e, slot);
    G.ents.push(e);
  });

  const taken = new Set(players.map(q => q.char)), pool = RIVALS.map((r, i) => i).filter(i => !taken.has(i));
  for (let b = 0; b < m.bots; b++) {
    const ci = pool.splice(Math.floor(rng() * pool.length), 1)[0], r = RIVALS[ci];
    const host = m.host === NET.id;
    const e = newEntity(CARS[r.car], host
      ? { ai: true, bot: b, name: r.name, pal: r.pal, rival: ci, lane: [-0.5, 0.45, -0.15, 0.6, 0.1, -0.35, 0.3][b % 7] * (T.hw - 60),
          baseSkill: (0.975 - b * 0.018 + CLASSES[m.cls].ai) * CLASSES[m.cls].mul }
      : { remote: true, bot: b, name: r.name, pal: r.pal });
    if (host) e.skill = e.baseSkill;
    e.face = ci;
    place(e, m.grid.length + b);

}
// Stand van een ander voertuig: even terug in de tijd, tussen twee berichten in (of kort vooruit gerekend).
// Hoe ver terug past zich aan: 100 ms bij een rustige verbinding, meer (tot 250 ms) als berichten met horten binnenkomen,
// zodat de auto's van anderen niet gaan springen. De vertraging verandert geleidelijk.

}

// ---- punten in een online cup: iedereen telt zelf, uit dezelfde uitslag
function netScoreRace() {
  const r = NET.race;
  if (!r || r.scored) return;
  r.scored = true;
  if (r.omode !== 1) return;
  if (!NET.cup) NET.cup = { table: {}, race: -1 };
  liveOrder().forEach((e, i) => {
    const key = e === G.player ? 'p' + NET.id : e.netId != null ? 'p' + e.netId : 'b' + e.bot;
    const row = NET.cup.table[key] || (NET.cup.table[key] = { name: e === G.player ? netName() : e.name, face: e.face, pts: 0, me: e === G.player });
    row.pts += e.dnf ? 0 : POINTS8[i] || 0;
  });

}
function netHostStart() {

}
const netSteps = R => R.omode === 1 ? ['lobby', 'mode', 'cup', 'cls', 'bots', 'ready'] : ['lobby', 'mode', 'cup', 'track', 'cls', 'bots', 'ready'];

// ---- online-scherm: verbinden, kamer maken of meedoen, en dan de keuzes van de host
function netMenuKey(code, key, lr, ud, ok, back) {
  if (!NET.room) {
    // rijen: 0 je naam, 1 serveradres, 2 kamer maken, 3 meedoen met code
    // in een tekstveld zijn W en S letters, geen pijltjes
    const letter = NET.row !== 2 && /^Key[A-Z]$/.test(code);
    if (ud && !letter) { NET.row = (NET.row + ud + 4) % 4; beep(520, 0.06, 'square', 0.04); return; }
    if (code === 'Escape') { ui.screen = 'car'; return; }
    if (NET.row === 0) {
      // naam: hoofdletters, cijfers, spatie en een paar tekens die het lettertype kent; hoogstens 12
      if (code === 'Backspace') { netNameTyped = netNameTyped.slice(0, -1); netSaveName(); return; }
      if (key && key.length === 1) {
        const ch = key.toUpperCase();
        if (/[A-Z0-9 .!?'-]/.test(ch) && netNameTyped.length < 12 && !(ch === ' ' && !netNameTyped)) { netNameTyped += ch; netSaveName(); }
        return;
      }
      if (code === 'Enter') { NET.row = 2; beep(780, 0.06, 'square', 0.04); }
      return;
    }
    if (NET.row === 1 || NET.row === 3) {
      const field = NET.row === 1 ? 'addr' : 'code';
      if (code === 'Backspace') { NET[field] = NET[field].slice(0, -1); if (NET.row === 1) NET.typed = true; return; }
      if (key && key.length === 1 && code !== 'Space') {
        const ch = NET.row === 1 ? key.toLowerCase() : key.toUpperCase();
        const okc = NET.row === 1 ? /[a-z0-9.:\/-]/.test(ch) : /[A-Z]/.test(ch);
        if (okc && NET[field].length < (NET.row === 1 ? 60 : 4)) { NET[field] += ch; if (NET.row === 1) NET.typed = true; }
        return;
      }
    }
    if (code !== 'Enter') return;
    beep(780, 0.06, 'square', 0.04);
    if (NET.row === 1) netConnect();
    else if (NET.row === 2) netConnect(() => NET.send({ t: 'create' }));
    else if (NET.code.length === 4) netConnect(() => NET.send({ t: 'join', code: NET.code }));
    else NET.err = 'TYPE THE 4-LETTER ROOM CODE';
    return;
  }
  const R = NET.room, host = isHost();
  if (/^Digit[1-4]$/.test(code)) { netEmote(+code[5] - 1); return; }
  if (!host || R.state === 'race') {
    if (R.state === 'race' && host && code === 'KeyE') NET.send({ t: 'end' });
    if (back) { NET.send({ t: 'leave' }); NET.room = null; }
    return;
  }
  // de host: elke keuze is een eigen scherm; Enter verder, Esc terug
  const set = netSet;
  const steps = netSteps(R);
  let si = steps.indexOf(R.step);
  if (si < 0) si = 0;
  if (back) {
    if (si === 0) { NET.send({ t: 'leave' }); NET.room = null; }
    else set({ step: steps[si - 1] });
    return;
  }
  if (lr || ud) beep(520, 0.06, 'square', 0.04);
  switch (R.step) {
    case 'mode': if (lr || ud) set({ omode: 1 - R.omode, cupRace: 0 }); break;
    case 'cup':
      if (lr) set({ cup: (R.cup + lr + CUPS.length) % CUPS.length, cupRace: 0 });
      if (ud) { const n = R.cup + ud * 4; if (n >= 0 && n < CUPS.length) set({ cup: n, cupRace: 0 }); }
      break;
    case 'track': if (lr) set({ tr: (R.tr + lr + 3) % 3 }); break;
    case 'cls': if (lr) set({ cls: (R.cls + lr + 3) % 3 }); break;
    case 'bots': if (lr || ud) set({ bots: Math.max(0, Math.min(8 - R.players.length, R.bots + (lr || -ud))) }); break;
  }
  if (ok) {
    beep(780, 0.06, 'square', 0.04);
    if (R.step !== 'ready') set({ step: steps[si + 1] });
    else netHostStart();
  }
}

        text(CARS[p.car].name + (p.id === R.host ? '  - HOST' : ''), x + cw / 2, y + 106 * u, 11 * u, p.id === R.host ? acc : '#cfd3ff', 'center', 700, false);

    }
    const msg = host ? (R.players.length > 1 ? 'PRESS ENTER WHEN EVERYONE IS IN' : 'SHARE THE CODE - OR PRESS ENTER TO GO ALONE') : 'WAITING FOR THE HOST...';
    if (Math.sin(G.time * 5) > -0.3) text(msg, W / 2, y0 + 2 * ch + gap + 40 * u, 18 * u, '#fff', 'center', 900);
  } else if (R.step === 'mode') {
    header(u, 'SINGLE RACE OR CUP?', '');
    const gap = 30 * u, cw = Math.min(340 * u, (W - 60 * u - gap) / 2), ch = 260 * u, x0 = W / 2 - cw - gap / 2, y0 = H * 0.28;
    [['SINGLE RACE', 'One race on a track', 'of your choice'], ['CUP', 'Three races in a row,', 'points for every race']].forEach((it, i) => {

// ---------------------------------------------------------------- hoofdlus
loadTrack(1);
let last = performance.now(), accu = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  // online moet de race gelijk blijven lopen met de klok van de anderen: na een hapering (tot een seconde) rekent het
  // spel de gemiste stappen in. Anders rijdt wie hapert in beeld achter, maar met een kortere eigen racetijd.
  const maxDt = G.mode === 'online' && G.state !== 'menu' ? 1 : 0.1;
  if (dt > maxDt) dt = maxDt;
  if (!(dt >= 0)) dt = 0;   // na een lange laadtijd kan het eerste beeldje een negatieve tijd geven
  update(Math.min(dt, 0.1));   // camera, menu's en effecten blijven bij de oude grens; alleen de physics haalt in
  if (G.state !== 'menu' && (!G.paused || G.mode === 'online')) {
    accu += dt;
    while (accu >= DT) {
      for (const e of G.ents) { e.px = e.x; e.py = e.y; e.pth = e.th; e.pz = e.z; }
      tick();
      accu -= DT;
    }
  }
  const al = G.state !== 'menu' && (!G.paused || G.mode === 'online') ? accu / DT : 1;
  for (const e of G.ents) {
    if (e.px == null) { e.px = e.x; e.py = e.y; e.pth = e.th; e.pz = e.z; }
    e.rx = e.px + (e.x - e.px) * al; e.ry = e.py + (e.y - e.py) * al;
    e.rth = e.pth + (e.th - e.pth) * al; e.rz = e.pz + (e.z - e.pz) * al;
  }
  const P = G.player, inGame = G.state !== 'menu' && P;
  musicSync(dt);
  updateAudio(inGame ? Math.hypot(P.vx, P.vy) : 0, inGame && P.in.acc ? 1 : 0, inGame && P.boosting, inGame && !G.paused);
  render(dt);
  if (ui.options) drawOptions(H / 720);
  requestAnimationFrame(frame);
}
